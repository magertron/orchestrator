apiVersion: v2
name: mcp-orchestrator
description: Magertron™ AI Orchestrator — Kubernetes-native governance, metering and audit for LLM, MCP and API traffic
type: application
version: 4.0.88
appVersion: "4.0.88"
keywords:
  - mcp
  - model-context-protocol
  - orchestrator
  - kubernetes
  - ai
  - llm
home: https://magertron.com
sources:
  - https://github.com/magertron/orchestrator
icon: https://magertron.com/logo-mark.png
maintainers:
  - name: Magertron
    email: sales@magertron.com
    url: https://magertron.com
annotations:
  # ── Artifact Hub display metadata ─────────────────────────────────────────
  # https://artifacthub.io/docs/topics/annotations/helm/
  # These annotations control how Magertron renders on artifacthub.io —
  # the de-facto Helm chart registry. Affects search ranking, category
  # placement, link panel, screenshot carousel, and the rendered changelog.

  artifacthub.io/displayName: "Magertron™ AI Orchestrator"

  artifacthub.io/category: security

  artifacthub.io/license: Apache-2.0

  artifacthub.io/keywords: "ai orchestrator, ai gateway, llm gateway, mcp, model context protocol, mcp gateway, ai governance, agent governance, ai cost governance, finops, metering, chargeback, audit, kubernetes, envoy, ext_authz, rbac, sso, oidc, saml, scim, multi-tenant, ocsf, siem, helm chart"

  artifacthub.io/operator: "false"

  artifacthub.io/prerelease: "false"

  artifacthub.io/containsSecurityUpdates: "true"

  # Rich link panel — appears on the chart page above the install instructions.
  # Each link gets a styled card; users can click straight to docs, security
  # narrative, SIEM integration guide, etc.
  artifacthub.io/links: |
    - name: Website
      url: https://magertron.com
    - name: Security & Threat Model
      url: https://magertron.com/security.html
    - name: SIEM Integration Guide
      url: https://magertron.com/siem-integration.html
    - name: About
      url: https://magertron.com/about.html
    - name: Source Code
      url: https://github.com/magertron/orchestrator
    - name: Documentation
      url: https://github.com/magertron/orchestrator#readme

  # Screenshot carousel on the chart page. Renders inline.
  # Each screenshot needs a public URL and a title that becomes alt text +
  # the caption on hover.
  artifacthub.io/screenshots: |
    - title: Dashboard — MCP servers running in your cluster
      url: https://magertron.com/screenshots/dashboard.png
    - title: Server detail — live metrics, logs, one-click rollback
      url: https://magertron.com/screenshots/server-detail.png
    - title: Governance — namespace-scoped policies for prod vs dev
      url: https://magertron.com/screenshots/governance.png

  # Maintainer cards — richer than the top-level `maintainers:` field.
  # Each appears with avatar + name + role on the chart page.
  artifacthub.io/maintainers: |
    - name: Magertron
      email: sales@magertron.com

  artifacthub.io/changes: |
    - kind: security
      description: "PostgreSQL now ships as a Magertron build of postgres:17-alpine with gosu removed. gosu carried 25 HIGH/CRITICAL CVEs (Trivy); the image now scans clean."
    - kind: security
      description: "PostgreSQL runs as non-root (uid 70) with pod fsGroup 70. No privilege drop at startup is needed, so the root-to-postgres helper is gone entirely."
    - kind: security
      description: "mcp-sync: golang.org/x/net upgraded to v0.60.0 (CVE-2026-78669, HTTP/2 SETTINGS denial of service). Image scans clean."
    - kind: changed
      description: "Init-container wait image bumped from busybox 1.36 to 1.37."
    - kind: added
      description: "Dashboard Tokens tab: LLM spend, calls, cost per call, cache hit rate and dollars saved by prompt caching, with a daily token/cost chart and top model x caller x server rows."
    - kind: fixed
      description: "In-console assistant calls routed through the LLM proxy were metered twice (once by the proxy, once by the assistant). The assistant now skips its own metering when the proxy has already recorded the call."
