{{- if .Values.inventory.enabled }}
# ─────────────────────────────────────────────────────────────────────────────
# mcp-inventory — federation / discovery sidecar
# ─────────────────────────────────────────────────────────────────────────────
# Separate Deployment (not a sidecar in the orchestrator pod) because
# endpoint agents talk to it independently of the orchestrator data plane.
# Different scaling characteristics, different failure isolation.
#
# Connection wiring at startup:
#   • DB:   {{ include "mcp.fullname" . }}-inventory-postgres:5432 (ClusterIP, in-cluster)
#   • Auth: MCP_JWT_PUBLIC_KEY from the existing orchestrator secret.
#           Agent tokens validate against this key with audience
#           "mcp-inventory" and scope "inventory:write".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp.fullname" . }}-inventory
  namespace: {{ include "mcp.namespace" . }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    component: inventory
spec:
  replicas: {{ .Values.inventory.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "mcp.fullname" . }}-inventory
  template:
    metadata:
      labels:
        app: {{ include "mcp.fullname" . }}-inventory
        component: inventory
    spec:
      {{- with .Values.inventory.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.inventory.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.inventory.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # ⚠ Without this, inventory exits 1 when its database is not up yet
      # (`ping db: connection refused`) and restarts — and the orchestrator,
      # starting in parallel, runs seeding against an inventory that is not
      # serving. Seeding gets a 404, gives up, and leaves MAG_SA_JWT empty;
      # every assistant call afterwards returns HTTP 401 naming a credential
      # rather than the database that was late.
      #
      # Same shape as probod's wait-postgres (probod.yaml) — deliberately
      # identical, so there is one way to express this and not two.
      initContainers:
        - name: wait-inventory-postgres
          image: busybox:1.36
          command: ['sh', '-c',
            'until nc -z {{ include "mcp.fullname" . }}-inventory-postgres 5432; do echo waiting for inventory-postgres; sleep 2; done']
      containers:
        - name: mcp-inventory
          image: "{{ .Values.inventory.image.repository }}:{{ .Values.inventory.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.inventory.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            # ── HTTP listener ───────────────────────────────────────────
            - name: MCP_INVENTORY_LISTEN_ADDR
              value: ":8090"

            # ── Drift probe ───────────────────────────────────────────────
            # Unset falls back to the Go default of 10s, so an older chart and
            # a newer image agree without either knowing about the other.
            - name: MCP_INVENTORY_PROBE_TIMEOUT_SECONDS
              value: {{ .Values.inventory.probeTimeoutSeconds | default 10 | quote }}

            # ── DB connection ───────────────────────────────────────────
            - name: MCP_INVENTORY_DB_HOST
              value: {{ include "mcp.fullname" . }}-inventory-postgres
            - name: MCP_INVENTORY_DB_PORT
              value: "5432"
            - name: MCP_INVENTORY_DB_NAME
              value: {{ .Values.inventory.postgresql.database | quote }}
            - name: MCP_INVENTORY_DB_USER
              value: {{ .Values.inventory.postgresql.username | quote }}
            - name: MCP_INVENTORY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp.fullname" . }}-secrets
                  key: MCP_INVENTORY_DB_PASSWORD
            - name: MCP_INVENTORY_DB_POOL_SIZE
              value: {{ .Values.inventory.dbPoolSize | quote }}

            # ── Auth ────────────────────────────────────────────────────
            # Same RS256 keypair the orchestrator uses for data-plane auth.
            # Endpoint agents carry tokens with scope "inventory:write" and
            # audience "mcp-inventory".
            #
            # We pass BOTH the public and private key from the orchestrator's
            # secret. The binary prefers MCP_INVENTORY_JWT_PUBLIC_KEY when it
            # is non-empty; otherwise it derives the public key from
            # MCP_INVENTORY_JWT_PRIVATE_KEY at startup. The chart's Free-tier
            # auto-gen path produces only a private key (orchestrator derives
            # the public at runtime), so the derivation fallback is the
            # common case — not an edge case.
            - name: MCP_INVENTORY_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp.fullname" . }}-secrets
                  key: MCP_JWT_PUBLIC_KEY
            - name: MCP_INVENTORY_JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp.fullname" . }}-secrets
                  key: MCP_JWT_PRIVATE_KEY
            - name: MCP_INVENTORY_JWT_AUDIENCE
              value: "mcp-inventory"

            # ── Pipeline tuning ─────────────────────────────────────────
            - name: MCP_INVENTORY_QUEUE_SIZE
              value: {{ .Values.inventory.config.queueSize | quote }}
            - name: MCP_INVENTORY_WRITER_BATCH
              value: {{ .Values.inventory.config.writerBatch | quote }}
            - name: MCP_INVENTORY_MAX_OBS_PER_BATCH
              value: {{ .Values.inventory.config.maxObservationsPerBatch | quote }}
            - name: MCP_INVENTORY_LOG_LEVEL
              value: {{ .Values.inventory.config.logLevel | quote }}

            # ── Scheduled drift introspection (rug-pull protection) ─────
            # This service EXECUTES the probes: the orchestrator decides which
            # servers are due and pushes a batch to /_admin/probe, and we do
            # the tools/list through the gateway, then record the result via
            # the same hash + upsert path the sidecar push uses.
            #
            # MCP_INVENTORY_PROBE_GATEWAY_BASE — where to send those calls.
            # Defaults to the in-cluster Envoy v3 service. Prefer that over the
            # public URL: the public URL works (the cluster hairpins) but
            # egresses through the CDN, adding cost, latency and a third-party
            # dependency to a governance control that should stay
            # self-contained. Port 10444 matches the envoy-v3 service's
            # container port — if that ever changes, update both together.
            - name: MCP_INVENTORY_PROBE_GATEWAY_BASE
              value: {{ .Values.inventory.config.probeGatewayBase | default (printf "https://%s-envoy-v3.%s.svc.cluster.local:10444" (include "mcp.fullname" .) (include "mcp.namespace" .)) | quote }}
            # MCP_INVENTORY_PROBE_TLS_VERIFY — false because the in-cluster
            # gateway presents a SELF-SIGNED certificate (CN=mcp-orchestrator)
            # with no subjectAltName covering its service DNS name, so
            # verification fails outright and a CA bundle does not help (the
            # cert is its own issuer AND the name still would not match).
            #
            # What that gives up is narrow: TLS here provides transport
            # encryption, not identity. The prober does not rely on the
            # certificate to know it reached the right gateway — it
            # authenticates TO the gateway with a signed service-account JWT
            # over a hop that never leaves the cluster network.
            #
            # Set true once the gateway cert carries proper SANs. That is the
            # real fix; this flag exists so it becomes a config change.
            - name: MCP_INVENTORY_PROBE_TLS_VERIFY
              value: {{ .Values.inventory.config.probeTlsVerify | quote }}

            # ── Catalog ingest ──────────────────────────────────────────
            # Reads a customer's EXISTING object graph — Snowflake today — and
            # hands it to the orchestrator, which reconciles it into
            # uc_securable.
            #
            # It lives here because the drivers do: gosnowflake is first-class
            # and the C++ side would be hand-rolling the REST SQL API. The
            # poller decides NOTHING about what a sync means — what a vanished
            # object implies, what a rename is, whether an empty read is a real
            # answer. Those live in the orchestrator's reconcile(), one tested
            # implementation shared by every connector.
            #
            # Setting MCP_ORCH_API_BASE is what ENABLES the poller: absent, it
            # never starts. mcp-inventory's job is federation, and a deployment
            # that has not configured catalog ingest should not see it fail
            # every minute.
            #
            # No token is mounted. The poller mints a five-minute JWT per cycle
            # from MCP_INVENTORY_JWT_PRIVATE_KEY, which this pod already holds
            # because it issues its own — so there is no second credential to
            # rotate and nothing long-lived readable in `kubectl describe pod`.
            {{- if and .Values.inventory.catalogIngest .Values.inventory.catalogIngest.enabled }}
            - name: MCP_ORCH_API_BASE
              value: {{ .Values.inventory.catalogIngest.orchestratorApiBase | quote }}
            # Where credential secrets live. A source's credential_ref names a
            # secret HERE — "name" or "name/key", key defaulting to "dsn".
            - name: MCP_CREDENTIAL_NAMESPACE
              value: {{ .Values.inventory.catalogIngest.credentialNamespace | default (include "mcp.namespace" .) | quote }}
            # How often to ASK what is due. Each source carries its own
            # sync_interval_seconds, so this is only the polling cadence.
            - name: MCP_CATALOG_POLL_SECONDS
              value: {{ .Values.inventory.catalogIngest.pollSeconds | default 60 | quote }}
            # The PROVISIONED service-account token.
            #
            # A file, not an env var: a token in the pod spec is readable by
            # anyone who can `kubectl describe pod`, and it lands in every
            # events dump after that.
            #
            # It has to be provisioned rather than minted. Tokens here are not
            # merely signed, they are REGISTERED — every valid one carries
            # `jti` == `service_account_id` and resolves to a real
            # service-account row, which is what makes revocation by jti work.
            # A self-signed token names no account and fails validation whatever
            # its audience, with a 401 that says nothing about why.
            - name: MCP_SA_TOKEN_FILE
              value: /etc/mcp/catalog-ingest-token
            {{- end }}

          {{- if and .Values.inventory.catalogIngest .Values.inventory.catalogIngest.enabled }}
          volumeMounts:
            - name: catalog-ingest-token
              mountPath: /etc/mcp
              readOnly: true
          {{- end }}

          resources:
            {{- toYaml .Values.inventory.resources | nindent 12 }}

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5

      {{- if and .Values.inventory.catalogIngest .Values.inventory.catalogIngest.enabled }}
      volumes:
        - name: catalog-ingest-token
          secret:
            # Created out of band, because minting a service account is an
            # authenticated API call and a chart cannot make one. See
            # catalogIngest.tokenSecret in values.yaml for how.
            #
            # optional: the pod still starts without it — the poller warns and
            # stays idle rather than crash-looping, so a missing credential
            # cannot take down the inventory plane.
            secretName: {{ .Values.inventory.catalogIngest.tokenSecret | default "mcp-catalog-ingest-token" }}
            optional: true
            items:
              - key: token
                path: catalog-ingest-token
      {{- end }}
{{- end }}
