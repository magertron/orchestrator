{{- /*
Bundled Presidio (2026-11-09) - Microsoft Presidio Analyzer for PII detection on LLM
prompts and replies (names, places, ID numbers). Enable with install.sh
--enable-presidio, or presidio.enabled=true. The console (Governance -> PII) can also
deploy it later: it creates this same Deployment/Service with the same image.
In-cluster only (ClusterIP): prompt text is sent to it.
*/}}
{{- if .Values.presidio.enabled }}
{{- $name := printf "%s-presidio" (include "mcp.fullname" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ include "mcp.namespace" . }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: presidio
    magertron.io/deployed-by: chart
    app: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: presidio
    spec:
      containers:
        - name: analyzer
          image: "{{ .Values.presidio.image.repository }}@{{ .Values.presidio.image.digest }}"
          ports:
            - name: http
              containerPort: 3000
          # It loads a spaCy language model at start: ready after ~20-90 s.
          readinessProbe:
            httpGet: {path: /health, port: 3000}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 3000}
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 4
          resources:
            {{- toYaml .Values.presidio.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ include "mcp.namespace" . }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: presidio
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: 3000
      targetPort: 3000
{{- end }}
