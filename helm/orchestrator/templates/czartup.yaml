{{- if .Values.czartup.enabled }}
{{- /* Czartup may install app policies only where the admission policy below can guard it. */}}
{{- $czPol := and .Values.opa.enabled (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy") }}
{{- $czSA := printf "%s-czartup" (include "mcp.fullname" .) }}
# ─────────────────────────────────────────────────────────────────────────────
# Magertron Czartup(TM) — served at <magertron>/czartup/ (like /portal)
# ─────────────────────────────────────────────────────────────────────────────
# Envoy routes /czartup/* here with the prefix stripped (ads_subscriber.cpp,
# static cluster `czartup` in envoy-v3-bootstrap.yaml).
#
# ⚠ ONE MAGERTRON CREDENTIAL IN THIS POD, and it can only call a model. The page
# reads the console's session token (same site, sessionStorage "mcp.auth.token")
# and sends it with every call; Czartup checks it against the orchestrator and
# then acts AS THAT PERSON. Every change it makes is audited to whoever clicked.
# The exception is Describe it: the LLM proxy refuses a person's token (lockdown
# a), so that one call uses the console assistant's service account
# (system:llm-consumer), mounted below from the assistant Secret. Only a signed-in
# administrator reaches it, and the pod log names who asked.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mcp.fullname" . }}-czartup
  namespace: {{ include "mcp.namespace" . }}
  # ⚠ The Czarters live here. Without this a fresh install (uninstall + install)
  # deletes the volume with the release and every Czarter on it.
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    component: czartup
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.czartup.storage.storageClassName }}
  storageClassName: {{ .Values.czartup.storage.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.czartup.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp.fullname" . }}-czartup
  namespace: {{ include "mcp.namespace" . }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    component: czartup
spec:
  type: ClusterIP
  selector:
    app: {{ include "mcp.fullname" . }}-czartup
  ports:
    - name: http
      port: 8791
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp.fullname" . }}-czartup
  namespace: {{ include "mcp.namespace" . }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    component: czartup
spec:
  # One replica: Czarters and run logs live on a ReadWriteOnce volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "mcp.fullname" . }}-czartup
  template:
    metadata:
      labels:
        app: {{ include "mcp.fullname" . }}-czartup
        component: czartup
    spec:
      {{- with .Values.czartup.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ $czSA }}
      # A Kubernetes token only when it may install app policies (the Role below, guarded).
      automountServiceAccountToken: {{ $czPol }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: czartup
          image: "{{ .Values.czartup.image.repository }}:{{ .Values.czartup.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.czartup.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8791
              protocol: TCP
          env:
            - name: CZARTUP_HOSTED
              value: "1"
            - name: CZARTUP_STORE
              value: /data
            # In-cluster: straight to the leader, like Envoy's mcp_orchestrator cluster.
            - name: CZARTER_API
              value: "http://{{ include "mcp.fullname" . }}-leader.{{ include "mcp.namespace" . }}.svc.cluster.local:{{ .Values.api.httpPort }}"
            # What the page shows and what the hand-over pack tells builders to call.
            - name: CZARTUP_PUBLIC_API
              value: {{ .Values.czartup.publicUrl | default .Values.orchestrator.env.apiPublicUrl | quote }}
            # Verify reads the installed allowances policy from the bundled OPA's ConfigMap.
            - name: CZARTUP_POLICY
              value: /policy/magertron.rego
            {{- if .Values.opa.enabled }}
            # Verify asks the live OPA for real decisions (over a limit -> refused, the agent alone
            # -> refused) and which apps' policies it has loaded.
            - name: CZARTUP_OPA_URL
              value: "http://{{ include "mcp.fullname" . }}-opa:8181"
            {{- end }}
            {{- if $czPol }}
            # Setup's "Install the app's policy": Czartup writes czarter-<app>-policy itself.
            - name: CZARTUP_K8S_POLICIES
              value: "1"
            - name: CZARTUP_OPA_NAMESPACE
              value: {{ include "mcp.namespace" . | quote }}
            {{- end }}
            # Describe it calls the model as the assistant's service account (see top).
            - name: CZARTUP_LLM_TOKEN_FILE
              value: /var/run/magertron/llm/token
            {{- with .Values.czartup.gitea.url }}
            - name: CZARTUP_GITEA
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.czartup.vault.addr }}
            - name: VAULT_ADDR
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.czartup.vault.skipVerify }}
            - name: VAULT_SKIP_VERIFY
              value: "true"
            {{- end }}
            {{- if .Values.czartup.vault.tokenSecret }}
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.czartup.vault.tokenSecret }}
                  key: {{ .Values.czartup.vault.tokenKey }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: policy
              mountPath: /policy
              readOnly: true
            - name: llm-sa
              mountPath: /var/run/magertron/llm
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.czartup.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "mcp.fullname" . }}-czartup
        - name: policy
          configMap:
            name: {{ include "mcp.fullname" . }}-opa-policy
            optional: true
        # ⚠ A FILE, not an env var: the kubelet refreshes a mounted Secret when
        # seeding rotates the token; an env var keeps the revoked one until restart.
        - name: llm-sa
          secret:
            secretName: {{ .Values.assistant.externalSecretName | default (printf "%s-assistant" (include "mcp.fullname" .)) }}
            optional: true
            defaultMode: 0440
            items:
              - key: MAG_SA_JWT
                path: token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $czSA }}
  namespace: {{ include "mcp.namespace" . }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    component: czartup
automountServiceAccountToken: false
{{- if $czPol }}
---
# ConfigMaps in this namespace - and the admission policy below narrows that to the apps' own policies.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $czSA }}-app-policies
  namespace: {{ include "mcp.namespace" . }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    component: czartup
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $czSA }}-app-policies
  namespace: {{ include "mcp.namespace" . }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    component: czartup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $czSA }}-app-policies
subjects:
  - kind: ServiceAccount
    name: {{ $czSA }}
    namespace: {{ include "mcp.namespace" . }}
---
# Czartup may write ONLY app-policy ConfigMaps: czarter-*, labelled, Rego in package magertron.apps.*.
# Everything else it tries is refused here, whatever its Role says.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $czSA }}-app-policies-only
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    component: czartup
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["configmaps"]
  matchConditions:
    - name: czartup-only
      expression: >-
        request.userInfo.username == 'system:serviceaccount:{{ include "mcp.namespace" . }}:{{ $czSA }}'
  validations:
    - expression: >-
        (request.operation == 'DELETE' ? oldObject : object).metadata.name.startsWith('czarter-')
      message: "Czartup may only write ConfigMaps named czarter-*"
    - expression: >-
        request.operation == 'DELETE' ||
        (has(object.metadata.labels) &&
         'magertron.io/czarter' in object.metadata.labels &&
         'openpolicyagent.org/policy' in object.metadata.labels &&
         object.metadata.labels['openpolicyagent.org/policy'] == 'rego')
      message: "an app policy must carry magertron.io/czarter and openpolicyagent.org/policy=rego"
    - expression: >-
        request.operation == 'DELETE' ||
        (has(object.data) && size(object.data) > 0 &&
         object.data.all(k, object.data[k].matches(r'(?m)^package magertron\.apps\.[a-z0-9_]+\s*$') &&
                            size(object.data[k].split('\npackage ')) == 2))
      message: "an app policy must be Rego in package magertron.apps.<name>, one package per file"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $czSA }}-app-policies-only
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    component: czartup
spec:
  policyName: {{ $czSA }}-app-policies-only
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ include "mcp.namespace" . }}
{{- end }}
{{- end }}
