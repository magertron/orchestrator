openapi: 3.1.0

# =============================================================================
# Magertron Platform API — v1
#
# ⚠ SCOPE. The orchestrator registers ~101 routes under /api/v1. This document
# describes the SUBSET that is intended for customer automation. Endpoints
# without `x-stability: preview` have response shapes asserted by the
# regression suite; preview endpoints are documented from the handlers and may
# still change. An endpoint's absence here does not mean it is unavailable — it
# means it is not yet a contract.
#
# ⚠ PROVENANCE. Every non-preview response schema here was taken from a LIVE
# response on 2026-08-16, not from reading the handlers. That matters: a first
# draft built from the request side got four things wrong — three endpoints
# wrap their results in an envelope rather than returning a bare array,
# Role.permissions is a structured object rather than a list of names, Budget
# carries live consumption fields, and User reports two different timestamp
# formats. Preview endpoints (added 2026-10-05) were documented from the
# handlers and a design partner's live trial; they carry the marker until a
# test pins their shape.
#
# ⚠ Where the API is inconsistent, this document says so rather than tidying it
# up. A spec that describes what you wish you had shipped is worse than none.
#
# NOT IN v1, deliberately:
#   * Unity Catalog (/api/v1/uc/...). Substantial and well-tested, but newer —
#     held for v2 rather than frozen early.
#   * Governance policy CRUD. Configured in the UI; not an automation surface.
#   * Service-account and contract CRUD — used by the console, documented next.
# =============================================================================

info:
  title: Magertron™ Platform API
  version: "1.4.0"
  summary: Governed control plane for MCP servers, agents and their traffic.
  description: |
    Magertron™ sits between agents and the MCP servers, LLM providers and REST
    APIs they call. This API is the automation surface for the control plane:
    registering and approving servers, provisioning roles and users, setting
    tool-level permissions, capping spend — and, in preview, the endpoints an
    agent developer needs: token exchange, the developer portal, and metering.

    ## Failure modes every client must handle

    **503 — not the current leader.** Mutating operations are leader-only, and
    the service load-balances across replicas. On a multi-replica install a
    write lands on a follower roughly half the time and is refused with a 503
    carrying `Retry-After: 1`. **Retry it.** The load balancer will route the
    retry elsewhere. This is not an error condition; it is the documented
    protocol, and a client that does not retry will appear to fail
    intermittently for no reason. Read operations are served by any replica and
    do not have this behaviour.

    **402 — tier capacity.** Server registration is capped per licence tier.
    The response body carries the current count and the cap, so a client can
    report the limit rather than the refusal.

    **400 — validation.** Field-level, with the offending value named. See each
    operation for its ranges.

    **404 — no such route.** Any unmatched path under `/api/`, `/mcp/` or
    `/healthz` returns `404` with `{"error":"not_found","detail":"No API route
    matches <path>"}`. (Builds before 2026-10-05 answered unmatched API paths
    with `200` and the console's HTML, so a typo read as success.)

    **500 — database errors are never echoed.** When a request fails inside the
    database, the response says `database error (ref <8 hex>; details in the
    server log)`. Quote the ref to your operator; the full message is logged
    against it. Validation and parse errors keep their specific messages.

    ## Authentication

    **Password login** (`POST /auth/login`) is for people. Once an identity
    provider is connected, administrator accounts are on a two-phase MFA chain:
    login returns `mfa_required` with a pending ticket rather than a token, and
    cannot be scripted.

    ⚠ **Bootstrap mode.** On an install with **no identity provider connected
    yet**, an administrator's password login returns a token directly, with
    `mfa_bootstrap: true` in the response, and the audit log records a
    `BootstrapAdminLogin` event ("privileged password login with no IdP
    configured"). MFA is enforced as soon as an IdP exists. Treat bootstrap as
    an install-time state: connect an identity provider before production use.

    **Service-account tokens** are what automation uses: a signed JWT carrying
    `scope_kind=service_account`, with no interactive MFA step. Create the
    service account and its key in the admin UI, then present the token as
    `Authorization: Bearer <jwt>`.

    **Exchanged tokens** (`POST /token/exchange`, preview) are what an agent
    uses: an RFC 8693 exchange that turns the agent's own token — and, when
    acting for someone, that person's token — into a five-minute credential.

    ⚠ The token's `sub` is the identity every grant is keyed on. Delegated
    OAuth in particular matches on an exact `sub`, and a mismatch returns
    `consent_required` — which reads as "nobody authorized this" rather than
    "you authorized a different principal".

    ### Token scopes

    A token may carry a `scopes` claim that **narrows** what it can call at the
    gateway. A call must be allowed by the principal's roles **and** match one
    of the token's scopes; scopes never widen access.

    | Scope | Allows |
    |---|---|
    | `*` | everything the roles allow |
    | `tool:<glob>` | tools matching the glob, e.g. `tool:get_system_time`, `tool:search_*` |
    | `server:<ns>/<name>` | ⚠ not matched yet — a token whose only scopes are `server:` is refused |

    Scopes for other services in the same claim (e.g. `inventory:read`) do not
    affect gateway calls. Service accounts get scopes from their *Scopes*
    field; the developer portal mints tool-scoped tokens (`POST /portal/token`).
    Before 2026-10-05 the claim was written but not enforced.

    ### Gateway denials

    Tool calls go through the MCP gateway (`/mcp/{ns}/{name}/`), not this API,
    but their refusals have one documented shape worth keying on:

    ```
    403 ext_authz: No permission for tool '<tool>'. Principal '<sub>' has roles [<roles>]. Reason: <admin's text, when the rule has one>
    ```

    The prefix `No permission for tool` is stable; the `Reason:` text is
    whatever an administrator wrote on the rule and must not be parsed.

    ## Namespaces

    There is **no endpoint to create or delete namespaces**, and no namespace
    editor in the admin UI — namespaces are not managed as objects.

    A namespace comes into being when a server is registered into it: you name
    it **explicitly**, in the deploy wizard or in `POST /servers`, and the
    platform creates the Kubernetes namespace if it does not already exist.

    `namespace` is **required** on registration — it is not defaulted, so
    omitting it is a 400.

    `GET /namespaces` lists the ones the caller may act in.

    ## What v1 commits to

    These are the platform's core operations — registering a server, granting a
    role, capping spend. They are the oldest and least volatile part of the
    surface, and we do not expect them to change.

    **Within v1:**

    * An existing field will not be removed, renamed, or change type.
    * New **optional** fields may be added to responses. Your client must
      ignore fields it does not recognise — that is the only forward
      compatibility this promise requires of you.
    * New optional request fields may be added. Existing requests keep working.
    * Status codes for a given outcome will not change.

    Operations marked `x-stability: preview` are **excluded from these
    promises** until a regression test pins their shape. They are documented
    because developers need them now; expect additive changes.

    **Breaking changes go to `/api/v2`.** When v2 ships, **v1 remains
    supported for 12 months** from that date.

    ⚠ **What is NOT covered.** The orchestrator registers roughly a hundred
    routes under `/api/v1/`. This document describes thirty operations across
    twenty-five paths, six of them in preview. The rest are reachable, and some are useful, but they carry no
    contract and may change in any release without notice. In particular:

    * `/api/v1/uc/...` — Unity Catalog. Substantial and well-tested, but newer;
      held for v2 rather than frozen early.
    * Service-account and contract creation — console-driven today.
    * Governance policy CRUD, drift, and the assistant endpoints.

    If you need one of those, say so — the bar for adding an endpoint to v1 is
    a test that pins its shape, not a decision that it seems stable.

    ⚠ **Two things this document freezes, deliberately.** `Permission` exposes
    the platform's internal enum ordinals: `resource_type` values and the
    `actions` bitmask. Publishing them means those numbers can never be
    reordered or reassigned. And three endpoints wrap their results in an
    envelope while two return bare arrays — an inconsistency recorded here
    rather than tidied, because changing it now would break the very clients
    this document exists to enable.

  contact:
    name: Magertron
    url: https://magertron.com
  license:
    name: Proprietary

servers:
  - url: https://{host}:{port}/api/v1
    description: Orchestrator API. UI, REST API and the MCP gateway share one port.
    variables:
      host:
        default: app.magertron.com
      port:
        default: "30444"
        description: |
          NodePort installs default to 30444. `install.sh --node-port` overrides
          it; `kubectl get svc -n mcp-system` confirms what is listening.

security:
  - bearerAuth: []

tags:
  - name: Servers
    description: |
      Register, approve, inspect and remove MCP servers. The primary automation
      surface — provisioning from CI lives here.
  - name: RBAC
    description: Roles, users, and tool-level permissions.
  - name: Budgets
    description: Per-server spend caps enforced at the gateway.
  - name: Auth
    description: Obtaining a token.
  - name: Agents
    description: |
      Preview. What an agent developer needs: token exchange, the developer
      portal's catalog and token minting.
  - name: Billing
    description: Preview. Metering and contract cost reads.
  - name: Namespaces
    description: Enumerating tenants.
  - name: System
    description: Preview. Host health.
  - name: AI Estate
    description: |
      Preview. AI agents on managed laptops: what each device reports (fleet
      sync), the agent hooks policy, the per-action decision the hook asks
      for, and device hook keys. Six agents are hooked: Claude Code, Cursor,
      Codex, Gemini CLI, Windsurf and GitHub Copilot CLI.
  - name: Holds
    description: |
      Preview. Calls and agent actions waiting for a person's approval — from
      the gateway and from laptops (namespace `_endpoint`).
  - name: Service accounts
    description: |
      Preview. Machine identities: create, list, change, rotate and revoke the
      accounts automation and agents sign in as. Admin-only (ManageRoles).
  - name: Webhooks
    description: |
      Preview. Outbound notifications: deployments, failures, holds and
      service-account expiry, POSTed to your endpoint and optionally signed.
  - name: Audit
    description: |
      Preview. Reading the audit trail and the signed authority record of a
      turn, for a SIEM pull or an auditor.
  - name: External policy
    description: |
      Preview. Enterprise. The customer's own policy decision point (OPA):
      its status, which namespaces ask it, the allowances it reads, and dry
      runs. The policy itself stays in git — there is no API to edit Rego.
  - name: PII
    description: |
      Preview. Personal data on model calls: the estate default, per-server
      settings, the detector (regex or Presidio) and the Never redact list.
  - name: Agent protection
    description: |
      Preview. What an agent must prove before it acts for a person: a person
      behind the call, bound delegation, the person's MFA, key-bound tokens,
      agents' sign-in keys, and how each identity provider's tokens are read.
      Changes need system:platform-admin.

# =============================================================================
paths:

  # ─── Auth ───────────────────────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Exchange username and password for a token
      operationId: login
      security: []
      description: |
        For people, not automation. Once an identity provider is connected,
        accounts on the two-phase MFA chain — which includes administrators by
        policy — receive `mfa_required: true` and a `pending` ticket instead of
        a token, and must complete the IdP leg.

        ⚠ **Bootstrap mode:** with no identity provider connected, an
        administrator receives a token directly, marked `mfa_bootstrap: true`.
        See *Authentication* in the API description.

        **Automation should use a service-account token instead** and not call
        this endpoint at all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: |
            Either a token, or an MFA challenge. The two are distinguished by
            the presence of `mfa_required` — check it before reading `token`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LoginToken"
                  - $ref: "#/components/schemas/LoginMfaChallenge"
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ─── Agents (preview) ───────────────────────────────────────────────────
  /token/exchange:
    post:
      tags: [Agents]
      summary: Exchange a token for a short-lived Magertron credential (RFC 8693)
      operationId: tokenExchange
      x-stability: preview
      security: []
      description: |
        Trades an agent's token — and, to act for a person, that person's token
        — for a **five-minute** credential carrying both identities, signed.

        * Agent alone: send `subject_token` = the agent's token.
        * Acting for a person: `subject_token` = the **person's** token,
          `actor_token` = the **agent's** token. ⚠ The RFC's names read
          backwards: the subject is the human. Sending only a subject token is
          a valid, **undelegated** exchange — calls with it are attributed to
          the agent alone.

        Both tokens must carry the exchange audience your platform team
        configured (an id_token will not).

        **Non-delegable roles.** If the person holds a non-delegable role
        (default: `system:platform-admin`, `system:operator`,
        `system:model-compare`; `MCP_NON_DELEGABLE_ROLES` overrides), the
        exchange is refused with 403 and no credential is issued, and a
        `TokenExchangeDenied` audit row names both identities.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, subject_token, subject_token_type]
              properties:
                grant_type:
                  type: string
                  const: urn:ietf:params:oauth:grant-type:token-exchange
                subject_token:
                  type: string
                  description: The agent's token, or — when delegating — the PERSON's token.
                subject_token_type:
                  type: string
                  const: urn:ietf:params:oauth:token-type:jwt
                actor_token:
                  type: string
                  description: When delegating, the AGENT's token.
                actor_token_type:
                  type: string
                  const: urn:ietf:params:oauth:token-type:jwt
      responses:
        "200":
          description: A credential valid for five minutes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 300 }
        "401":
          description: |
            A token failed verification, or names an identity the platform does
            not know. The message says which, e.g.
            `actor_token verification failed: …`,
            `No user is provisioned for subject '…'. The person an agent acts for must be a known identity.`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: The person holds a non-delegable role.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, const: access_denied }
                  error_description: { type: string }
              example:
                error: access_denied
                error_description: "user 'ops-admin' holds a non-delegable role (system:platform-admin): an agent may not act for an administrator"

  /portal/catalog:
    get:
      tags: [Agents]
      summary: What the caller may call
      operationId: portalCatalog
      x-stability: preview
      description: |
        The servers and tools the caller's roles reach, as the developer portal
        shows them. When acting for a person, call it with the **person's**
        token alone — the intersection with your agent hides tools your agent
        happens to lack, which is a confusing answer to "what can I do here".
        Every call is gated regardless, so nothing becomes reachable by being
        listed.
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }

  /portal/token:
    post:
      tags: [Agents]
      summary: Mint a personal token from the developer portal
      operationId: portalToken
      x-stability: preview
      description: |
        Mints a token for the signed-in person, for a script or agent they run.
        It carries the person's own subject and roles — **never more**.

        * `scope: "my-access"` (or omitted): everything the person's roles allow.
        * `scope: "this-tool"` with `tool`: a token whose `scopes` claim is
          `["tool:<tool>"]` — the gateway refuses any other tool with it.
          Without `tool` (or with an invalid name) the request is refused with 400.
          The response echoes `scope` and `scopes`.

        ⚠ **Lifetime is one hour**, and the token cannot be revoked early: its
        short life is the control. Anything that must run longer belongs on a
        service account, which can be rotated and revoked.

        Administrators can disable minting (`portal.allow_mint_token`); the
        endpoint then returns 403.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  type: string
                  description: Free-text label recorded in the audit log. Does not affect access.
                scope:
                  type: string
                  enum: [my-access, this-tool]
                  default: my-access
                tool:
                  type: string
                  description: Required when `scope` is `this-tool`. Letters, digits, `_`, `-`, `.`; up to 128 characters.
                  example: get_system_time
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_in: { type: integer, example: 3600 }
                  purpose: { type: string }
                  scopes:
                    type: array
                    items: { type: string }
                    description: Empty for `my-access`; `["tool:<tool>"]` for `this-tool`.
        "400":
          description: '`scope` is `this-tool` but `tool` is missing or invalid.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: |
            Not signed in. ⚠ Deliberately 401, not 403, even when minting is
            disabled: telling an unauthenticated caller a feature is off tells
            them it exists.
        "403":
          description: Minting is disabled on this install, or the caller lacks portal access.

  # ─── Billing (preview) ──────────────────────────────────────────────────
  /billing/meter-events:
    get:
      tags: [Billing]
      summary: Metered calls, one row per call per dimension
      operationId: listMeterEvents
      x-stability: preview
      description: |
        The raw meter: one row per call **per dimension** (`calls`, `bytes`,
        tokens, `amount_usd`, …). Count calls on `dimension = calls`; the other
        rows are the same call's other measures.

        **Delegated calls** carry `on_behalf_of` (the person), `caller_type:
        user`, and a `caller_display` of `<person> · via <agent>`.
        `caller_user_id` remains the identity that authenticated (the agent).
        Filtering by `caller_user_id` matches either identity.

        **Retries** sent with the same `Idempotency-Key` produce one row.
      parameters:
        - { name: caller_user_id, in: query, schema: { type: string }, description: "Matches the authenticating identity OR the person a delegated call was for." }
        - { name: caller_type, in: query, schema: { type: string, enum: [user, service_account] } }
        - { name: dept_id, in: query, schema: { type: string, format: uuid } }
        - { name: server_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: namespace, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: A page of meter rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/MeterEvent" }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /contracts/{contractId}/costs:
    parameters:
      - name: contractId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Billing]
      summary: Rated cost of a contract for one billing period
      operationId: getContractCosts
      x-stability: preview
      description: |
        The rating engine's output for one period, by dimension.

        ⚠ `cost_state` here is the **rating** state (`ESTIMATED` until the
        period is finalised, then `FINAL`). The `cost_state` on meter events is
        a different thing — whether a rate card priced the row (`RATED` or
        blank). Calls appear here once rated, normally within a minute or two.
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, example: "2026-10" }
          description: '`YYYY-MM` or `YYYY-MM-DD`; either is read as that month. (Earlier builds accepted only `YYYY-MM-DD`.)'
      responses:
        "200":
          description: The period's costs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract_id: { type: string, format: uuid }
                  period: { type: string, example: "2026-10-01" }
                  total_usd: { type: number }
                  cost_state: { type: string, enum: [ESTIMATED, FINAL, ""] }
                  by_dimension:
                    type: array
                    items:
                      type: object
                      properties:
                        tool_id: { type: string }
                        dimension: { type: string }
                        quantity: { type: number }
                        amount_usd: { type: number }
                        cost_state: { type: string }
        "400":
          description: |
            `contract id must be a UUID`, or
            `period must be YYYY-MM or YYYY-MM-DD, e.g. 2026-10`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ─── System (preview) ───────────────────────────────────────────────────
  /admin/disk/health:
    get:
      tags: [System]
      summary: Host disk usage, as the platform sees it
      operationId: getDiskHealth
      x-stability: preview
      description: |
        Free space on the node's disk, read from inside the orchestrator pod.
        Kubernetes evicts pods — Postgres included — at roughly 85–90% used, so
        the thresholds sit below that. At `critical`, deploying, scaling up and
        pulling models are refused with `507`.
        Thresholds: `MCP_DISK_WARN_PCT` (75), `MCP_DISK_CRIT_PCT` (80).
      responses:
        "200":
          description: Disk usage.
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  path: { type: string, example: / }
                  total_bytes: { type: integer }
                  used_bytes: { type: integer }
                  avail_bytes: { type: integer }
                  used_pct: { type: number, example: 62.1 }
                  status: { type: string, enum: [ok, warning, critical] }
                  thresholds:
                    type: object
                    properties:
                      warning_pct: { type: number }
                      critical_pct: { type: number }
        "403": { description: Caller may not read platform health. }

  # ─── Namespaces ─────────────────────────────────────────────────────────
  /namespaces:
    get:
      tags: [Namespaces]
      summary: List namespaces the caller may act in
      operationId: listNamespaces
      description: |
        ⚠ Scoped to the caller. A namespace-confined principal sees only its
        own; a platform administrator sees all. The list is therefore an
        accurate statement of reach, not a global inventory.

        There is no create or delete counterpart. Namespaces are not managed
        as objects — see the Namespaces note in the API description.
      responses:
        "200":
          description: |
            Namespace names, plus whether the caller is unconfined.
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespaces:
                    type: array
                    items: { type: string }
                  wildcard:
                    type: boolean
                    description: |
                      True when the caller may act in ANY namespace, including
                      ones not yet created. A confined principal gets `false`
                      and only the namespaces it holds.
              example:
                namespaces: ["mcp-csis", "mcp-prod"]
                wildcard: true
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ─── Servers ────────────────────────────────────────────────────────────
  /servers:
    get:
      tags: [Servers]
      summary: List servers
      operationId: listServers
      description: |
        Returns every server the caller may see, across namespaces. Each entry
        is either an `internal` or an `external` server and **the two carry
        different fields** — see the `Server` schema.
      responses:
        "200":
          description: Servers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Server" }
        "401": { $ref: "#/components/responses/Unauthorized" }

    post:
      tags: [Servers]
      summary: Register a server
      operationId: createServer
      description: |
        Registers an internal (image-backed) or external (endpoint-backed)
        server. The `type` field discriminates, and the required fields differ
        accordingly.

        ⚠ **The namespace is created if it does not exist.** Naming it here is
        the only way a namespace comes into being — there is no namespace
        endpoint and no namespace editor in the UI.

        ⚠ **External servers are not routable until approved.** Registration
        puts them in `Registered`; `POST /servers/{ns}/{name}/approve` moves
        them to `Active` and builds the gateway route.

        ⚠ **Internal servers reach `Running` on their own**: the platform waits
        for the pod, runs the MCP handshake and discovers its tools — typically
        within seconds of the pod becoming ready.

        ⚠ **Disk guard.** An internal deploy is refused with `507` when the
        node's disk is at its critical threshold (see `GET /admin/disk/health`).
        `"ignore_disk_guard": true` overrides, and is logged.

        ⚠ **Leader-only.** See the 503 note in the API description.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CreateInternalServer"
                - $ref: "#/components/schemas/CreateExternalServer"
              discriminator:
                propertyName: type
                mapping:
                  internal: "#/components/schemas/CreateInternalServer"
                  external: "#/components/schemas/CreateExternalServer"
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
        "200":
          description: Registered (some builds return 200 rather than 201).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
        "400":
          description: |
            Validation failure. `mcp_port` must be 1–65535 and `replicas`
            1–1000; both are checked before parsing, because an out-of-range
            port would otherwise be silently truncated into a valid-looking one.
            A missing `namespace` also lands here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "402": { $ref: "#/components/responses/TierCapacity" }
        "403":
          description: |
            Refused by governance policy. The body carries a `violations` array
            naming each rule, its severity and the offending value — **read it
            rather than the top-level message**, which says only that a policy
            refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernanceRejection" }
        "409":
          description: |
            A server already exists with that name in that namespace, or (for
            external servers) at that endpoint URL in that namespace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/NotLeader" }
        "507": { $ref: "#/components/responses/InsufficientDisk" }

  /servers/{namespace}/{name}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/ServerName"
    get:
      tags: [Servers]
      summary: Get one server
      operationId: getServer
      responses:
        "200":
          description: The server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: |
            Transiently unavailable — the orchestrator could not reach its
            database. Retry.
    delete:
      tags: [Servers]
      summary: Delete a server
      operationId: deleteServer
      description: |
        Removes the server, its route, and — for DCR-provisioned external
        servers — the credential Secret registration created.

        ⚠ **Financial records survive.** `meter_events` and `cost_contracts`
        rows for this server are retained deliberately: chargeback integrity
        and SOC 2 evidence must outlive the resource they describe.

        ⚠ **Leader-only.**
      responses:
        "200": { description: Deleted. }
        "202": { description: Deletion accepted. }
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotLeader" }

  /servers/{namespace}/{name}/approve:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/ServerName"
    post:
      tags: [Servers]
      summary: Approve an external server
      operationId: approveServer
      description: |
        Moves an external server from `Registered` (or `Inactive`) to `Active`,
        builds its gateway cluster and route, resolves any mTLS client
        certificate from its Secret, and pushes the configuration.

        ⚠ **Approving an already-Active server is a RECONCILE, not a no-op.**
        A server can sit in `Active` with no route — re-approving rebuilds the
        downstream state and returns `reconciled: true`. This is the correct
        thing to try when traffic to an Active server 404s.

        ⚠ Valid only for `server_type: external`. Internal servers become
        routable through deployment, not approval.

        ⚠ **Leader-only.**
      responses:
        "200":
          description: Active.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, example: Active }
                  reconciled:
                    type: boolean
                    description: True when the server was already Active and downstream state was rebuilt.
        "400":
          description: |
            Not an external server, or not in a state approval accepts
            (`Registered` or `Inactive`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotLeader" }

  /servers/{namespace}/{name}/disable:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/ServerName"
    post:
      tags: [Servers]
      summary: Disable a server
      operationId: disableServer
      description: |
        Withdraws the server's gateway route. Traffic stops; the registration,
        its credentials and its history remain. Re-enable with `approve`.

        ⚠ **Leader-only.**
      responses:
        "200": { description: Disabled. }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotLeader" }

  /servers/{namespace}/{name}/tools:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/ServerName"
    get:
      tags: [Servers]
      summary: List a server's discovered tools
      operationId: listServerTools
      description: |
        Tools as discovered from the server itself, not as declared by an
        operator. `input_schema` is the tool's own JSON Schema, passed through.
      responses:
        "200":
          description: Tools.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tool" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── RBAC: roles ────────────────────────────────────────────────────────
  /roles:
    get:
      tags: [RBAC]
      summary: List roles
      operationId: listRoles
      responses:
        "200":
          description: Roles, both built-in and custom.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [RBAC]
      summary: Create a role
      operationId: createRole
      description: |
        ⚠ Do not create a role whose `id` begins `system:`. Those identifiers
        belong to built-in roles defined in the platform, and a database row
        shadowing one leaves two definitions of the same role that can diverge.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRole" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: A role with that id already exists. }
        "503": { $ref: "#/components/responses/NotLeader" }

  /roles/{roleId}:
    parameters:
      - name: roleId
        in: path
        required: true
        schema: { type: string }
        example: custom:portal-user
    delete:
      tags: [RBAC]
      summary: Delete a role
      operationId: deleteRole
      description: |
        ⚠ Users holding the role lose it. Tool permissions granted to it
        cascade away with it.
      responses:
        "200": { description: Deleted. }
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotLeader" }

  # ─── RBAC: users ────────────────────────────────────────────────────────
  /users:
    get:
      tags: [RBAC]
      summary: List users
      operationId: listUsers
      responses:
        "200":
          description: |
            Users, wrapped in an `items` envelope. Password hashes are never
            returned.

            ⚠ Note the inconsistency: `/users` and `/budgets` and `/namespaces`
            wrap their results; `/servers` and `/roles` return bare arrays.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [RBAC]
      summary: Create a user
      operationId: createUser
      description: |
        ⚠ **Set `email`.** It is the recovery path on an install with no
        identity provider, the destination for alerts, and what an IdP-returned
        identity is matched against if SSO is added later. A user created
        without one becomes a second, unmatchable account at that point.

        ⚠ A developer using the portal needs three roles together —
        `system:mcp-consumer`, `system:llm-consumer` and `system:api-consumer`.
        With only the first, their agent is refused the moment it reaches a
        model, which reads as a broken platform rather than a missing grant.

        ⚠ **Departments.** Delegated calls are charged to the *person's*
        department. A user in no department charges nobody — map people to a
        department for chargeback to attribute their spend.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUser" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: That username already exists. }
        "503": { $ref: "#/components/responses/NotLeader" }

  /users/{username}:
    parameters:
      - name: username
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [RBAC]
      summary: Delete a user
      operationId: deleteUser
      responses:
        "200": { description: Deleted. }
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotLeader" }

  /users/{username}/roles:
    parameters:
      - name: username
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [RBAC]
      summary: Replace a user's roles
      operationId: setUserRoles
      description: |
        ⚠ **Replaces, does not add.** The array you send becomes the user's
        complete role set; anything omitted is removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items: { type: string }
                  example: ["system:mcp-consumer", "system:llm-consumer", "system:api-consumer"]
      responses:
        "200": { description: Roles set. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotLeader" }

  # ─── RBAC: tool permissions ─────────────────────────────────────────────
  /tool-rbac/servers/{namespace}/{name}/permissions:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/ServerName"
    post:
      tags: [RBAC]
      summary: Grant or deny a role access to a server's tools
      operationId: createToolPermission
      description: |
        ⚠ **Each call ADDS a rule; it does not replace one.** Posting an ALLOW
        to a role that already carries a DENY leaves both in place, and DENY
        wins. To change a decision, delete the existing rule first.

        ⚠ **Enforcement is not immediate.** ext_authz decides from a cache that
        refreshes about once a minute, so a freshly written grant can take that
        long to take effect. Automation that writes a grant and immediately
        exercises it should poll rather than assume.

        ⚠ **`reason` is shown to callers.** When a rule refuses a call, its
        reason is appended to the gateway's denial after the fixed
        `No permission for tool …` text — write it for the person who will
        read it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateToolPermission" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolPermission" }
        "200":
          description: Created (some builds return 200).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolPermission" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/NotLeader" }

  /tool-rbac/servers/{namespace}/{name}/permissions/test:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/ServerName"
    post:
      tags: [RBAC]
      summary: Dry-run an authorization decision
      operationId: testToolPermission
      description: |
        Resolves what the policy engine WOULD decide for a set of roles,
        without making a call and without writing anything. Useful for proving
        a grant before relying on it, and for explaining a refusal: the trace
        lists every rule that matched, in precedence order.

        ⚠ **`role_ids` is an array.** (Earlier versions of this document showed
        a single `role_id`; the endpoint has always required the array.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_ids, tool_name]
              properties:
                role_ids:
                  type: array
                  items: { type: string }
                  example: ["system:mcp-consumer"]
                tool_name: { type: string, example: get_system_time }
      responses:
        "200":
          description: The decision, the rule that produced it, and every rule that matched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  server: { type: string }
                  tool_name: { type: string }
                  role_ids:
                    type: array
                    items: { type: string }
                  allowed: { type: boolean }
                  effect_applied:
                    type: string
                    enum: [ALLOW, DENY, NO_POLICY, ENFORCEMENT_DISABLED]
                  reason:
                    type: string
                    description: For a refusal, the same text the gateway returns — `No permission for tool …`.
                  matched_policy_id: { type: string, format: uuid }
                  matched_role_id: { type: string }
                  matched_pattern: { type: string }
                  matched_pattern_type: { type: string, enum: [EXACT, WILDCARD, REGEX] }
                  matching_policies_trace:
                    type: array
                    description: Every matching rule, in precedence order; the first decided.
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        role_id: { type: string }
                        tool_pattern: { type: string }
                        pattern_type: { type: string }
                        effect: { type: string }
        "400":
          description: '`role_ids (array) and tool_name are required`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tool-rbac/permissions/{permissionId}:
    put:
      tags: [RBAC]
      summary: Change a tool permission
      operationId: updateToolPermission
      description: |
        Fields sent replace; omitted fields keep their values. `role_id` and the
        server cannot change.

        ⚠ **An effect change (ALLOW ⇄ DENY) is a transition, not an edit.** The
        rule is closed (its `valid_until` set) and a successor is created with a
        NEW id, returned with `replaces: <old id>`, so the audit trail keeps the
        fact that it ever said the other thing. A reason or pattern edit updates
        in place.

        ⚠ A PUT or DELETE to a closed rule's id returns **404** "is closed and
        no longer in force". Follow `replaces` to the rule in force.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pattern_type: { type: string, enum: [EXACT, WILDCARD, REGEX] }
                tool_pattern: { type: string }
                effect: { type: string, enum: [ALLOW, DENY] }
                reason: { type: string }
                valid_from: { type: [string, "null"], format: date-time }
                valid_until: { type: [string, "null"], format: date-time }
      responses:
        "200":
          description: The rule in force — a new id with `replaces` after an effect change.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: Unknown id, or the rule is closed. }
    parameters:
      - name: permissionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [RBAC]
      summary: Delete a tool permission rule
      operationId: deleteToolPermission
      responses:
        "200": { description: Deleted. }
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotLeader" }

  # ─── Budgets ────────────────────────────────────────────────────────────
  /budgets:
    get:
      tags: [Budgets]
      summary: List budgets
      operationId: listBudgets
      responses:
        "200":
          description: Budgets, wrapped in a `budgets` envelope.
          content:
            application/json:
              schema:
                type: object
                properties:
                  budgets:
                    type: array
                    items: { $ref: "#/components/schemas/Budget" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /budgets/{namespace}/{name}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/ServerName"
    get:
      tags: [Budgets]
      summary: Get a server's budget
      operationId: getBudget
      responses:
        "200":
          description: The budget, with current usage against it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "404":
          description: |
            No budget set for this server. The message reads `No budget set for <ns>/<name>`.
    put:
      tags: [Budgets]
      summary: Set or replace a server's budget
      operationId: putBudget
      description: |
        A budget caps spend either as a percentage of the server's contractual
        commitment or as an absolute dollar limit. When both are present the
        stricter applies.

        ⚠ **Enforcement lags the write by roughly 45 seconds** — the gateway
        decides from a cached view. A client that sets a budget and immediately
        expects a block should poll rather than assume.

        ⚠ A percentage-anchored budget cannot be set below current usage: there
        is no threshold that would refuse traffic already incurred. Use the
        absolute limit for that case.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutBudget" }
      responses:
        "200":
          description: Set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotLeader" }

  /budgets/{namespace}/{name}/override:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/ServerName"
    post:
      tags: [Budgets]
      summary: Override a budget block
      operationId: setBudgetOverride
      description: |
        Lifts enforcement without deleting the budget — the ceiling stays
        recorded and visible, traffic resumes. The audit trail records who
        overrode it and when.

        ⚠ Subject to the same ~45s cache lag as setting a budget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [override]
              properties:
                override: { type: boolean }
      responses:
        "200": { description: Override set. }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotLeader" }

  /budgets/{budgetId}:
    parameters:
      - name: budgetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Budgets]
      summary: Delete a budget
      operationId: deleteBudget
      responses:
        "200": { description: Deleted. }
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotLeader" }

  # ─── AI Estate ──────────────────────────────────────────────────────────
  /fleet/sync:
    post:
      tags: [AI Estate]
      summary: Report one MCP client config from a device
      operationId: fleetSync
      x-stability: preview
      security:
        - bearerAuth: []
        - inventoryToken: []
      description: |
        Called by the fleet script (MDM, Ansible or by hand) once per config
        file it finds, and once with no file when it finds none, so the device
        still checks in.

        ⚠ **Rewriting is policy, not a request parameter.** `mode` in the
        response is whatever the tenant's fleet rewrite mode resolves to;
        a caller cannot ask for `enforce`.

        ⚠ `env` and `headers` values, and secrets in `args` / URLs, are masked
        on the device before sending. `config_sha256` is of the original file,
        so change detection still works.

        The response also carries the agent hooks mode, which the script uses
        to install or remove the hooks on the device.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FleetSyncRequest" }
      responses:
        "200":
          description: Recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetSyncResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /inventory/agents:
    get:
      tags: [AI Estate]
      summary: List devices, or one device's MCP servers
      operationId: listInventoryAgents
      x-stability: preview
      description: |
        Without `include`, one row per (token subject, device). With
        `include=servers` and `host_id`, every MCP server declared on that
        device, with how it is routed — the AI Estate → Devices view.
      parameters:
        - name: agent_id
          in: query
          schema: { type: string }
          description: Only devices reporting under this token subject.
        - name: host_id
          in: query
          schema: { type: string, pattern: "^[A-Za-z0-9._:-]+$" }
          description: The device. Required with `include=servers`.
        - name: include
          in: query
          schema: { type: string, enum: [servers] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: |
            `items` holds `InventoryAgent` rows, or `DeviceServer` rows with
            `include=servers`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/InventoryAgent"
                        - $ref: "#/components/schemas/DeviceServer"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /settings/endpoint-hooks:
    get:
      tags: [AI Estate]
      summary: Get the agent hooks policy
      operationId: getEndpointHooks
      x-stability: preview
      description: Every key is present; gaps are filled with defaults.
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EndpointHookPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [AI Estate]
      summary: Change the agent hooks policy
      operationId: putEndpointHooks
      x-stability: preview
      description: |
        Send only the keys to change. `rules`, when sent, replaces the whole
        list. Each change is audited as `EndpointHookPolicyChanged`.

        ⚠ **Two speeds.** `mode` and `fail` reach laptops at their next MDM
        check-in (that is when hooks are installed or removed). Rules and the
        other settings apply to the next decision, within ~10 s on every
        replica.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EndpointHookPolicy" }
      responses:
        "200":
          description: The policy after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EndpointHookPolicy" }
        "400":
          description: |
            A value out of range, an unknown action, or a rule whose `match` is
            not a valid regular expression. The message names which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /endpoint/decide:
    post:
      tags: [AI Estate]
      summary: May this agent action run?
      operationId: endpointDecide
      x-stability: preview
      security:
        - deviceKey: []
        - bearerAuth: []
      description: |
        Called by `magertron-hook` on the laptop before an agent runs a
        command, reads or edits a file, fetches a URL or calls an MCP tool.
        Tool names arrive in Claude Code's vocabulary whichever agent asked
        (`Bash`, `Read`, `Write`, `Edit`, `WebFetch`, `WebSearch`, `mcp__…`),
        so one rule list covers every agent.

        With a **device key** the device is the key's, never the body's
        `device_id`. With a JWT (admins, tests) `device_id` is a claim.

        **Hold.** A `hold` answer carries `hold_id`; the hook re-asks with it
        every few seconds, up to `wait_seconds`. An approval releases this
        exact action once; a decline denies it.

        **Rate limit.** Over `device_rate_per_minute`, enforce mode answers
        `deny` with `rule: rate-limit` (observe answers `allow`). Re-asks
        about a real pending hold are not counted.

        **Audit.** Deny, ask and hold are written one by one
        (`EndpointToolDecision`); plain allows are counted into
        `EndpointToolAllowSummary` unless `allow_audit` is `all`.

        `{"ping": true}` checks a key without asking anything.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EndpointDecideRequest" }
      responses:
        "200":
          description: |
            The decision, or `{"ok": true, "device_id": …}` for a ping.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EndpointDecision" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /endpoint/enroll:
    post:
      tags: [AI Estate]
      summary: Issue a device its own hook key
      operationId: endpointEnroll
      x-stability: preview
      security:
        - inventoryToken: []
        - bearerAuth: []
      description: |
        Called by the fleet script, as root, with the MDM inventory token. The
        key it returns (`mhk.…`) can ask `/endpoint/decide` about this device
        and nothing else. Audited as `EndpointDeviceEnrolled`.

        ⚠ **Enrolling again replaces the device's key**; the old one stops
        working. Anyone holding the MDM token can enroll any device id — the
        MDM token is the trust anchor, and it lives root-only on managed
        machines.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
                hostname: { type: string, maxLength: 255 }
                mdm: { type: string, description: "jamf | intune | manual | …", default: unknown }
      responses:
        "200":
          description: The key. Shown once; store it root-owned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hook_token: { type: string, example: "mhk.Y3phcg.…" }
                  device_id: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /endpoint/devices/{deviceId}/key:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
    delete:
      tags: [AI Estate]
      summary: Revoke a device's hook key
      operationId: revokeEndpointKey
      x-stability: preview
      description: |
        The key stops working at once. ⚠ The device enrolls again at its next
        check-in (so this is a rotation); revoke its MDM token as well to
        shut it out. Audited as `EndpointDeviceKeyRevoked`.
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean, const: true }
                  device_id: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── Holds ──────────────────────────────────────────────────────────────
  /holds:
    get:
      tags: [Holds]
      summary: List holds you may see
      operationId: listHolds
      x-stability: preview
      description: |
        Holds you are an approver of, that are for you, or in a namespace you
        can read. Laptop holds have namespace `_endpoint`.
      responses:
        "200":
          description: Holds, wrapped in a `holds` envelope.
          content:
            application/json:
              schema:
                type: object
                properties:
                  holds:
                    type: array
                    items: { $ref: "#/components/schemas/Hold" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /holds/{holdId}:
    parameters:
      - $ref: "#/components/parameters/HoldId"
    get:
      tags: [Holds]
      summary: Get a hold
      operationId: getHold
      x-stability: preview
      responses:
        "200":
          description: The hold.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hold" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /holds/{holdId}/approve:
    parameters:
      - $ref: "#/components/parameters/HoldId"
    post:
      tags: [Holds]
      summary: Approve a hold
      operationId: approveHold
      x-stability: preview
      description: |
        Releases the held call once: the identical call, resubmitted, goes
        through. Audited as `HoldApproved`.

        ⚠ The person a hold is for never decides it, and an agent alone never
        decides its own. When the hold names approvers, only they may decide.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HoldDecision" }
      responses:
        "200":
          description: The hold, now approved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hold" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The hold is no longer pending (approved, declined, consumed or expired).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /holds/{holdId}/decline:
    parameters:
      - $ref: "#/components/parameters/HoldId"
    post:
      tags: [Holds]
      summary: Decline a hold
      operationId: declineHold
      x-stability: preview
      description: |
        The held call, resubmitted, is refused with the note. Audited as
        `HoldDeclined`. Same rules on who may decide as approve.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HoldDecision" }
      responses:
        "200":
          description: The hold, now declined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hold" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The hold is no longer pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ─── Service accounts ───────────────────────────────────────────────────
  /service-accounts:
    get:
      tags: [Service accounts]
      summary: List service accounts
      operationId: listServiceAccounts
      x-stability: preview
      description: |
        Active accounts (not revoked, not expired), newest first, with
        `last_used_at` taken from the audit log — service accounts never log in,
        so this is the only "last seen" there is.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: "`next_cursor` from the previous page." }
        - { name: organization_id, in: query, schema: { type: string, format: uuid }, description: Defaults to the default organization. }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ServiceAccount" } }
                  next_cursor: { type: string, description: Absent on the last page. }
                  total: { type: integer, description: Size of the whole filtered set, not the page. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Service accounts]
      summary: Create a service account
      operationId: createServiceAccount
      x-stability: preview
      description: |
        Creates the account and returns its token **once**, in `token`. It is
        not retrievable afterwards — store it before doing anything else.

        ⚠ **`subject` is permanent and is what every grant is keyed on.** It
        becomes the token's `sub`; it cannot be patched. Name it for the job:
        `ci-provisioner`, `finance-export`.

        ⚠ **`organization_id` is required.** Single-organization installs use the
        default organization's id — read it from `GET /orgs`.

        Audited as `ServiceAccountCreated`. Capped per license tier: `402` when
        the cap is reached (existing accounts above a cap are kept; only new
        ones are refused).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateServiceAccount" }
      responses:
        "201":
          description: Created. `token` is shown this once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAccountWithToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          description: The license tier's service-account cap is reached.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  tier: { type: string }
                  current: { type: integer }
                  limit: { type: integer }
                  upgrade_url: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  /service-accounts/_quota:
    get:
      tags: [Service accounts]
      summary: How many service accounts the license allows
      operationId: getServiceAccountQuota
      x-stability: preview
      responses:
        "200":
          description: The cap and current use.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tier: { type: string, description: The tier the platform enforces. }
                  package: { type: string, description: "What was bought (e.g. Business), when the license names one." }
                  limit: { type: integer }
                  current: { type: integer, description: Active accounts. }
                  percent: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /service-accounts/{saId}:
    parameters:
      - $ref: "#/components/parameters/ServiceAccountId"
    get:
      tags: [Service accounts]
      summary: Get a service account
      operationId: getServiceAccount
      x-stability: preview
      responses:
        "200":
          description: The account. Never contains its token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Service accounts]
      summary: Change a service account
      operationId: updateServiceAccount
      x-stability: preview
      description: |
        Send only what changes. ⚠ **Immutable fields are refused, not
        ignored:** `id`, `subject`, `organization_id`, `expires_at`,
        `revoked_at`, `created_at` and `created_by` return `400`.

        ⚠ **New roles reach new tokens, not the one already issued.** A token
        carries the roles it was minted with; rotate (below) for a running
        agent to pick up a role change. Audited as `ServiceAccountUpdated`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchServiceAccount" }
      responses:
        "200":
          description: The account after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The account is revoked, or `external_id` is already held by another account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Service accounts]
      summary: Revoke a service account
      operationId: revokeServiceAccount
      x-stability: preview
      description: |
        Soft revoke: the row stays, because it owns metering and audit
        history. The token is refused at once by the replica that answered and
        within about 30 seconds by every other. Audited as
        `ServiceAccountRevoked`.
      responses:
        "204": { description: Revoked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /service-accounts/{saId}/rotate:
    parameters:
      - $ref: "#/components/parameters/ServiceAccountId"
    post:
      tags: [Service accounts]
      summary: Rotate a service account's token
      operationId: rotateServiceAccount
      x-stability: preview
      description: |
        Issues a new token for the same `subject`, roles and scopes, with the
        same lifetime as the original counted from now, and revokes the old
        one. Audited as `ServiceAccountRotated`.

        ⚠ **The response has a new `id`.** The account keeps its `subject`; its
        `id` (the token's `jti`) changes. Store the new id, or the next PATCH
        or DELETE addresses the revoked predecessor.

        ⚠ **The old token stops working at once** (within ~30 s on other
        replicas). Deploy the new one first if both must overlap — or create a
        second account, deploy, then revoke the first.
      responses:
        "200":
          description: The new account row and its token, shown this once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAccountWithToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The account is revoked; create a new one instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orgs:
    get:
      tags: [Service accounts]
      summary: List organizations
      operationId: listOrganizations
      x-stability: preview
      description: The organization ids `POST /service-accounts` needs. A single-organization install has one, `default`.
      responses:
        "200":
          description: Organizations.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ─── Webhooks ───────────────────────────────────────────────────────────
  /webhooks:
    get:
      tags: [Webhooks]
      summary: List webhooks
      operationId: listWebhooks
      x-stability: preview
      description: Read from the database, so every replica answers the same. Secrets are never returned.
      responses:
        "200":
          description: Webhooks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Webhook" } }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/FeatureRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Webhooks]
      summary: Create a webhook
      operationId: createWebhook
      x-stability: preview
      description: |
        ⚠ **The response names the webhook; it does not carry its id.** List
        and match on `name` to get the id you need for PUT, DELETE and test —
        so give each webhook a unique name.

        The URL must be http or https and must not point at an internal or
        private address (checked now, and again at every delivery, so DNS
        rebinding does not get round it).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookWrite" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  name: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/FeatureRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /webhooks/{webhookId}:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    get:
      tags: [Webhooks]
      summary: Get a webhook
      operationId: getWebhook
      x-stability: preview
      responses:
        "200":
          description: The webhook, without its secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/FeatureRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Webhooks]
      summary: Replace a webhook
      operationId: updateWebhook
      x-stability: preview
      description: |
        ⚠ **A replace, not a patch.** `name` and `url` are required, and
        omitted `event_types` / `namespaces` reset to `["*"]` — every event,
        every namespace. Send the whole webhook.

        ⚠ **Send `secret` again if the webhook is signed.** GET never returns
        it, so a read-modify-write without it may leave the webhook unsigned
        *(verify)*.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookWrite" }
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  name: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/FeatureRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Webhooks]
      summary: Delete a webhook
      operationId: deleteWebhook
      x-stability: preview
      responses:
        "200": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/FeatureRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /webhooks/{webhookId}/test:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    post:
      tags: [Webhooks]
      summary: Send a test notification
      operationId: testWebhook
      x-stability: preview
      description: |
        Sends one `Test` event now, signed like a real one. Answered by
        whichever replica you reach, unlike real deliveries, which only the
        leader sends.
      responses:
        "200": { description: Delivered — your endpoint answered 2xx. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/FeatureRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500":
          description: Not delivered — check the URL, and that your endpoint answers 2xx.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ─── Audit and evidence ─────────────────────────────────────────────────
  /audit:
    get:
      tags: [Audit]
      summary: Query the audit log
      operationId: queryAudit
      x-stability: preview
      description: |
        The append-only audit trail, newest first, OCSF-aligned. Paged by
        `page` and `size`; for a SIEM pull, page with a `from` window and keep
        the newest `occurred_at` you have seen.

        ⚠ **`occurred_at` is Unix seconds, as a string** (`"1764021600"`), not
        an ISO timestamp — while `from` and `to` take ISO 8601.

        ⚠ **`total` can be a floor.** With `total_capped: true` it means
        "at least this many"; keep paging rather than computing pages from it.

        **Namespace scoping is automatic.** A namespace-confined caller sees
        only its namespace, and asking for another returns nothing rather than
        an error.

        Prompt text is never in this list; it is a separate, audited read
        (`/audit/prompt/{turnId}`).
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, default: 50 } }
        - { name: kind, in: query, schema: { type: string }, example: EndpointToolDecision, description: One event kind. }
        - { name: actor, in: query, schema: { type: string }, description: Who authenticated. }
        - { name: exclude_actor, in: query, schema: { type: string }, description: Leave one actor out — e.g. the drift probe. }
        - { name: role, in: query, schema: { type: string }, description: Events by actors holding this role at the time. }
        - { name: namespace, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: delegated, in: query, schema: { type: boolean }, description: Only calls an agent made for a person. }
        - { name: exclude_handshake, in: query, schema: { type: boolean }, description: Leave out MCP initialize and list calls. }
        - { name: proposed_by, in: query, schema: { type: string, enum: [assistant] }, description: Only changes applied from an assistant proposal. }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
                  total: { type: integer }
                  total_capped: { type: boolean, description: "true: total is a floor, not an exact count." }
                  page: { type: integer }
                  size: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/FeatureRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /audit/prompt/{turnId}:
    parameters:
      - $ref: "#/components/parameters/TurnId"
    get:
      tags: [Audit]
      summary: Read what was asked in one turn
      operationId: getPromptText
      x-stability: preview
      description: |
        ⚠ **Every read is itself audited** (`PromptRevealed`, naming who read
        whose question), whether or not a prompt was recorded — "somebody
        looked" is the fact. Prompts exist only while prompt recording is on
        (Volume 2, Chapter 32).
      responses:
        "200":
          description: The prompt, or none.
          content:
            application/json:
              schema:
                type: object
                properties:
                  turn_id: { type: string }
                  prompt: { type: string }
                  recorded: { type: boolean, description: "false: recording was off for this turn — not an empty prompt." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /audit/turn-costs:
    get:
      tags: [Audit]
      summary: What a set of turns cost
      operationId: getTurnCosts
      x-stability: preview
      parameters:
        - name: turns
          in: query
          required: true
          schema: { type: string }
          description: Comma-separated turn ids; at most 100 are read.
      responses:
        "200":
          description: One row per turn that called a model.
          content:
            application/json:
              schema:
                type: object
                properties:
                  turns:
                    type: array
                    items:
                      type: object
                      properties:
                        turn_id: { type: string }
                        model_calls: { type: integer }
                        input_tokens: { type: integer }
                        output_tokens: { type: integer }
                        cached_tokens: { type: integer }
                        cost_usd: { type: number }
                        cost_uncached: { type: number, description: What it would have cost with cached tokens billed as ordinary input. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /evidence/public-key:
    get:
      tags: [Audit]
      summary: The key authority records are signed with
      operationId: getEvidencePublicKey
      x-stability: preview
      security: []
      description: |
        **No token needed**, deliberately: the verifier is meant to be somebody
        without an account here.

        ⚠ Fetching the key from the platform means trusting the platform for
        that fetch. Pin `key_id` out of band at the start of an engagement and
        check it thereafter (Volume 2, §33.5.3).
      responses:
        "200":
          description: The public key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_key_pem: { type: string }
                  key_id: { type: string, description: The fingerprint to pin. }
                  algorithm: { type: string, const: RS256 }
                  shared_with_jwt_key: { type: boolean, description: "true: the install signs records with its JWT key — set MCP_EVIDENCE_PRIVATE_KEY to separate them." }
        "404":
          description: No signing key configured; records are unsigned but still reproducible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /evidence/turns:
    get:
      tags: [Audit]
      summary: Find turns
      operationId: searchEvidenceTurns
      x-stability: preview
      description: |
        Find an exchange without knowing its turn id — by a name, a server, a
        tool, a verdict and a window.

        ⚠ **A window over 90 days needs a principal or a server**, and is
        refused with `400` rather than silently shortened. The window searched
        is returned with the answer, so "no turns" means "none in this window".
      parameters:
        - { name: principal, in: query, schema: { type: string }, description: Either side of a delegation — the agent or the person. }
        - { name: server, in: query, schema: { type: string } }
        - { name: tool, in: query, schema: { type: string } }
        - { name: verdict, in: query, schema: { type: string, enum: [allowed, denied] } }
        - { name: from, in: query, schema: { type: string, format: date-time }, description: Default 30 days ago. }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: Default now. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Matching turns, with the window and filters used.
          content:
            application/json:
              schema:
                type: object
                properties:
                  turns: { type: array, items: { type: object, additionalProperties: true } }
                  from: { type: string }
                  to: { type: string }
                  limit: { type: integer }
                  count: { type: integer }
                  filters: { type: object, additionalProperties: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/FeatureRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /evidence/turns/{turnId}:
    parameters:
      - $ref: "#/components/parameters/TurnId"
    get:
      tags: [Audit]
      summary: One turn's authority record
      operationId: getTurnEvidence
      x-stability: preview
      description: |
        Who asked, what each gate decided, which rules were in force **at that
        moment**, and what the record does not know — assembled on read, signed
        when the install has a key. Verify it outside Magertron with
        `tools/cfverify` (Volume 2, Chapter 33).
      responses:
        "200":
          description: The record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorityRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/FeatureRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No audit events correlate to this turn — it does not exist, or predates turn correlation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ─── External policy ────────────────────────────────────────────────────
  /governance/pdp:
    get:
      tags: [External policy]
      summary: External policy status
      operationId: getPdpStatus
      x-stability: preview
      description: Whether a PDP is configured, where, which namespaces ask it, its failure mode, this replica's decision counts, and its health.
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/FeatureRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /governance/pdp/policy:
    get:
      tags: [External policy]
      summary: The policy the PDP is running
      operationId: getPdpPolicy
      x-stability: preview
      description: Read from the PDP, as it is loaded now. Read-only — change it in git and redeploy (Volume 2, §35.5).
      responses:
        "200":
          description: "`available`, and `policies[]` with each module's `raw` Rego."
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/FeatureRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /governance/pdp/recommendations:
    get:
      tags: [External policy]
      summary: What to change, from the last 24 hours
      operationId: getPdpRecommendations
      x-stability: preview
      description: |
        Suggestions from 24 hours of audit and the PDP's own configuration —
        e.g. money-moving tools that no rule covers, with a starter rule. It
        suggests; a person writes and ships the policy.
      responses:
        "200":
          description: Recommendations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  window_hours: { type: integer }
                  audit_ok: { type: boolean }
                  policy_read: { type: boolean }
                  items: { type: array, items: { type: object, additionalProperties: true } }
                  jev: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/FeatureRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /governance/pdp/test-options:
    get:
      tags: [External policy]
      summary: Choices for a dry run
      operationId: getPdpTestOptions
      x-stability: preview
      description: The subject, server and tool combinations seen in the last 7 days, with each server's type, and the last deny. Cached for 5 minutes per replica.
      responses:
        "200":
          description: Options.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /governance/pdp/arg-values/{namespace}/{name}/{nouns}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/ServerName"
      - name: nouns
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_,]+$" }
        example: topics,endpoints
        description: What to list, comma-separated.
    get:
      tags: [External policy]
      summary: Live values for a dry run's arguments
      operationId: getPdpArgValues
      x-stability: preview
      description: Asks the server's own list tools (e.g. Kafka topics, ZeroMQ endpoints), so a dry run can pick a real value instead of remembering one.
      responses:
        "200":
          description: Values.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /governance/pdp/test:
    post:
      tags: [External policy]
      summary: Ask the PDP about a call, without making it
      operationId: testPdp
      x-stability: preview
      description: |
        Builds the input the gateway would send for this call and returns the
        PDP's answer, and the input itself. Never forwarded upstream, counted
        or recorded.

        Unless `spend` is given, the input carries the person's real
        month-to-date spend — send `spend` to ask "what if they had spent $40?".

        ⚠ **`in_scope: false` means the gateway would not ask the PDP at all**
        for this namespace, whatever it answers here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject: { type: string }
                roles: { type: array, items: { type: string } }
                on_behalf_of: { type: string }
                namespace: { type: string }
                server: { type: string }
                server_type: { type: string, enum: [mcp, internal, rest, llm], default: mcp }
                tool: { type: string }
                arguments: { type: object, additionalProperties: true }
                spend: { type: object, additionalProperties: true }
      responses:
        "200":
          description: The PDP's answer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  allow: { type: boolean }
                  error: { type: boolean, description: "true: no verdict — the PDP was unreachable or answered badly; the gateway would follow its failure mode." }
                  reason: { type: string }
                  in_scope: { type: boolean }
                  input: { type: object, additionalProperties: true, description: Exactly what the PDP was sent. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/FeatureRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: No PDP is configured (install with --enable-opa or --pdp-url).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /governance/authz/check:
    post:
      tags: [External policy]
      summary: Would this person's call be allowed now?
      operationId: checkAuthz
      x-stability: preview
      description: |
        For things one call created and that outlive it — a webhook delivering
        for 24 hours after it was registered. Their server asks again here, so
        a removed role or a changed policy stops them within minutes.

        Runs the gateway's own RBAC and PDP checks, live. **Not** checked: tool
        approval, delegation and merchant entitlement.

        ⚠ **`allowed: null` is not a deny.** It means the PDP gave no verdict;
        keep things as they are and ask again later.
        ⚠ **`known_subject: false`** means no such Magertron user — a service
        identity or a deleted user — and is for the caller to interpret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, namespace, server, tool]
              properties:
                subject: { type: string, description: A Magertron username. }
                namespace: { type: string }
                server: { type: string }
                tool: { type: string }
                arguments: { type: object, additionalProperties: true }
      responses:
        "200":
          description: The verdict, and which check decided.
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed: { type: [boolean, "null"] }
                  stage: { type: string, enum: [subject, rbac, pdp] }
                  reason: { type: string }
                  known_subject: { type: boolean }
                  roles: { type: array, items: { type: string } }
                  rbac: { type: [object, "null"], additionalProperties: true }
                  pdp: { type: [object, "null"], additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/FeatureRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /governance/pdp/namespaces:
    put:
      tags: [External policy]
      summary: Set which namespaces ask the PDP
      operationId: setPdpNamespaces
      x-stability: preview
      description: |
        Replaces the list, live on this replica at once and on the others at
        their next refresh. Overrides the install's `--pdp-namespaces` until
        reset (DELETE). Audited as `PdpScopeChanged`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [namespaces]
              properties:
                namespaces:
                  oneOf:
                    - { type: string, example: "mcp-prod,netops", description: 'Comma list, or "*" for every namespace.' }
                    - { type: array, items: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/PdpScope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/FeatureRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/PdpNotConfigured" }
    delete:
      tags: [External policy]
      summary: Back to the install's namespaces
      operationId: resetPdpNamespaces
      x-stability: preview
      description: Forgets the console's list; the install's `--pdp-namespaces` applies again.
      responses:
        "200": { $ref: "#/components/responses/PdpScope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/FeatureRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/PdpNotConfigured" }

  /governance/pdp/namespaces/{ns}:
    parameters:
      - $ref: "#/components/parameters/PdpNamespace"
    post:
      tags: [External policy]
      summary: Add one namespace
      operationId: addPdpNamespace
      x-stability: preview
      description: 'Idempotent: adding one already in scope (or when scope is `*`) answers `changed` false.'
      responses:
        "200": { $ref: "#/components/responses/PdpScope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/FeatureRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/PdpNotConfigured" }
    delete:
      tags: [External policy]
      summary: Remove one namespace
      operationId: removePdpNamespace
      x-stability: preview
      description: |
        ⚠ Refused (`409`) while scope is `*` — set a list first. Refused
        (`400`) if it would leave no namespace: use `*` or the install's
        default instead.
      responses:
        "200": { $ref: "#/components/responses/PdpScope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/FeatureRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: External Policy is not configured, or scope is every namespace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /governance/pdp/data:
    get:
      tags: [External policy]
      summary: The allowances the policy reads
      operationId: getPdpData
      x-stability: preview
      description: |
        Monthly allowances per person and budgets per department, with this
        month's spend, and the users and departments that may be named.
        `source` is `console` once saved here, otherwise `opa` (the
        `--opa-data` file) or `none`.
      responses:
        "200":
          description: The data, and where it came from.
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string, enum: [console, opa, none] }
                  data: { $ref: "#/components/schemas/PdpData" }
                  in_sync: { type: boolean, description: "false: saved, but the bundled OPA has not taken it yet." }
                  writable: { type: boolean, description: "false: your own PDP — edit its data where it lives." }
                  primary: { type: boolean }
                  region: { type: string }
                  spend: { type: object, additionalProperties: true }
                  users: { type: array, items: { type: string } }
                  departments: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/FeatureRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [External policy]
      summary: Change the allowances, live
      operationId: setPdpData
      x-stability: preview
      description: |
        Stores the numbers and pushes them to the bundled OPA's data API: live
        in about a second, no restart. Audited as `AllowancesChanged`, naming
        what changed.

        ⚠ **A replace.** Send the whole `data`; a person left out loses their
        allowance.
        ⚠ **Names must exist:** people by Magertron username, departments by
        name. A name that matches nobody would cap nobody, so it is refused.
        ⚠ **Bundled OPA only** — `409` with your own PDP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: "#/components/schemas/PdpData" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
                  pushed: { type: boolean, description: "false: saved, OPA retried every 30 s until it takes it." }
                  detail: { type: string }
                  data: { $ref: "#/components/schemas/PdpData" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/FeatureRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Not the bundled OPA.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [External policy]
      summary: Back to the data file
      operationId: resetPdpData
      x-stability: preview
      description: |
        Forgets the console's copy. ⚠ OPA keeps the numbers it holds until its
        next restart, when it loads the `--opa-data` file again. Audited as
        `AllowancesReset`.
      responses:
        "200": { description: Cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/FeatureRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ─── PII ────────────────────────────────────────────────────────────────
  /governance/pii:
    get:
      tags: [PII]
      summary: PII settings at a glance
      operationId: getPiiGovernance
      x-stability: preview
      description: The estate default, the detector and its health, the bundled Presidio's state, every PII type, and the Never redact list.
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  default_mode: { $ref: "#/components/schemas/PiiMode" }
                  detector: { type: object, additionalProperties: true }
                  presidio:
                    type: object
                    properties:
                      state: { type: string, enum: [none, starting, ready, failed] }
                      managed_by: { type: string, enum: [console, helm] }
                      name: { type: string }
                      namespace: { type: string }
                      url: { type: string }
                      image: { type: string }
                      reason: { type: string }
                  all_types: { type: array, items: { $ref: "#/components/schemas/PiiType" } }
                  default_types: { type: array, items: { $ref: "#/components/schemas/PiiType" } }
                  presidio_types: { type: array, items: { $ref: "#/components/schemas/PiiType" }, description: Found only with Presidio. }
                  allow_list: { type: array, items: { type: string } }
                  allow_list_seeded: { type: boolean, description: "true: the built-in list, never saved here." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /settings/pii-default:
    get:
      tags: [PII]
      summary: The estate default
      operationId: getPiiDefault
      x-stability: preview
      responses:
        "200":
          description: The default, and which detector runs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { $ref: "#/components/schemas/PiiMode" }
                  detector: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [PII]
      summary: Set the estate default
      operationId: setPiiDefault
      x-stability: preview
      description: Applies to every LLM server set to `default`; a server with its own setting keeps it. Live on the next call. Audited as `PiiPolicyChanged`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: "#/components/schemas/PiiMode" }
      responses:
        "200":
          description: Set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { $ref: "#/components/schemas/PiiMode" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /servers/{namespace}/{name}/pii:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/ServerName"
    get:
      tags: [PII]
      summary: One LLM server's PII setting
      operationId: getServerPii
      x-stability: preview
      responses:
        "200":
          description: The setting, and what is actually in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerPii" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [PII]
      summary: Set one LLM server's PII setting
      operationId: setServerPii
      x-stability: preview
      description: |
        `default` follows the estate default. `types` narrows what is looked
        for; omitted, the default types apply. Live on the next call. Audited
        as `PiiPolicyChanged`.

        ⚠ **Types beyond the default six need Presidio** (`presidio_types`):
        with the regex detector, a server set to find `person` finds nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [default, "off", detect, redact, block]
                types: { type: array, items: { $ref: "#/components/schemas/PiiType" } }
      responses:
        "200":
          description: The setting after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerPii" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /governance/pii/detector:
    put:
      tags: [PII]
      summary: Choose the detector
      operationId: setPiiDetector
      x-stability: preview
      description: |
        `regex` (built in) or `presidio` at a URL. Live on the next PII-checked
        call on every replica. Audited as `PiiPolicyChanged`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [detector]
              properties:
                detector: { type: string, enum: [regex, presidio] }
                url: { type: string, description: Required for presidio. }
                threshold: { type: number, minimum: 0, maximum: 1, default: 0.5, description: Presidio's confidence floor. }
                fail:
                  type: string
                  enum: [regex, open]
                  default: regex
                  description: "If Presidio is unreachable: fall back to regex, or check nothing."
                language: { type: string, default: en, pattern: "^[a-z]{2,5}$" }
      responses:
        "200":
          description: All PII settings after the change (as GET /governance/pii).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /governance/pii/detector/test:
    post:
      tags: [PII]
      summary: Check a Presidio URL
      operationId: testPiiDetector
      x-stability: preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
      responses:
        "200":
          description: Its health.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /governance/pii/allow:
    put:
      tags: [PII]
      summary: Replace the Never redact list
      operationId: setPiiAllowList
      x-stability: preview
      description: |
        Words never treated as personal data — product and brand names a
        detector would otherwise mistake for a person. A replace. Live on the
        next call on every replica. Audited as `PiiAllowListChanged`, with the
        words added and removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [words]
              properties:
                words: { type: array, items: { type: string }, example: [Magertron] }
      responses:
        "200":
          description: All PII settings after the change (as GET /governance/pii).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /governance/pii/presidio:
    post:
      tags: [PII]
      summary: Deploy the bundled Presidio
      operationId: deployPresidio
      x-stability: preview
      description: |
        Starts Microsoft Presidio in the platform namespace — about 2 GB of
        memory. Idempotent. ⚠ Deploying it does not switch the detector: set
        `detector: presidio` once `state` is `ready`.
      responses:
        "200":
          description: All PII settings (as GET /governance/pii), with Presidio starting.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [PII]
      summary: Remove the bundled Presidio
      operationId: removePresidio
      x-stability: preview
      description: |
        Switches the detector back to regex first if it pointed here, then
        removes it. ⚠ Refused for a Presidio installed by the chart
        (`install.sh --enable-presidio`) — upgrade without that flag instead.
      responses:
        "200":
          description: All PII settings (as GET /governance/pii).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ─── Agent protection ───────────────────────────────────────────────────
  /settings/agent-protection:
    get:
      tags: [Agent protection]
      summary: Agent protection, per namespace
      operationId: getAgentProtection
      x-stability: preview
      description: |
        The four switches for every namespace, and **readiness**: the last 7
        days of token exchanges, per agent — how many delegations were bound,
        showed the person's MFA, were key-bound — so you can see who would be
        refused before turning a switch on.
      responses:
        "200":
          description: Settings and readiness.
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespaces: { type: array, items: { $ref: "#/components/schemas/AgentProtection" } }
                  binding_mode: { type: string, enum: ["off", warn, enforce], description: The install's MCP_STS_SUBJECT_BINDING. }
                  binding_mode_set: { type: boolean }
                  readiness: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Agent protection]
      summary: Change agent protection in one namespace
      operationId: setAgentProtection
      x-stability: preview
      description: |
        Send the namespace and only the switches to change. Live on this
        replica at once and on the others at their next refresh. Audited as
        `AgentProtectionChanged`.

        ⚠ **Check readiness first.** Each switch refuses calls that do not meet
        it, from the next call: an agent that has never shown the person's MFA
        stops working the moment `require_mfa` is on.
        ⚠ **Platform admin only** — a namespace admin cannot lift protection
        from their own namespace.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentProtection" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
                  namespace: { type: string }
                  changes: { type: string, example: "+ require a person, + MFA for the person" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /settings/require-person:
    get:
      tags: [Agent protection]
      summary: Namespaces that refuse an agent calling alone
      operationId: getRequirePerson
      x-stability: preview
      description: The same switch as `require_person` in agent protection, as a list.
      responses:
        "200":
          description: The list, where it came from, and the namespaces it may name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespaces: { type: array, items: { type: string } }
                  source: { type: string }
                  known_namespaces: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Agent protection]
      summary: Replace the list
      operationId: setRequirePerson
      x-stability: preview
      description: |
        A replace. Only namespaces that have servers may be named. Platform
        admin only. Audited as `RequirePersonChanged`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [namespaces]
              properties:
                namespaces: { type: array, items: { type: string } }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
                  namespaces: { type: array, items: { type: string } }
                  source: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /settings/agent-keys:
    get:
      tags: [Agent protection]
      summary: Agents' sign-in keys
      operationId: listAgentKeys
      x-stability: preview
      description: Public keys registered per agent, for key-pair sign-in and key-bound tokens. Never private keys.
      responses:
        "200":
          description: Agents and their keys.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      type: object
                      properties:
                        subject: { type: string }
                        client_id: { type: string }
                        require: { type: boolean, description: "Key-pair only: no other sign-in accepted." }
                        keys:
                          type: array
                          items:
                            type: object
                            properties:
                              kid: { type: string }
                              kty: { type: string }
                              crv: { type: string }
                              thumbprint: { type: string }
                              added: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /settings/agent-keys/{subject}:
    parameters:
      - name: subject
        in: path
        required: true
        schema: { type: string }
        description: The agent's subject.
    put:
      tags: [Agent protection]
      summary: Add or remove a key, or set key-pair only
      operationId: setAgentKeys
      x-stability: preview
      description: |
        One or more of `add_key`, `remove_key`, `client_id`, `require`.
        Platform admin only. Audited as `AgentKeysChanged`.

        ⚠ **Public keys only.** A JWK with `d` is a private key and is refused
        — never send one.
        ⚠ **`require: true` needs a key first.** Turning on key-pair only for
        an agent with no key would lock it out, so it is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                add_key: { type: object, additionalProperties: true, description: "A public JWK: EC P-256, RSA 2048+ or Ed25519." }
                remove_key: { type: string, description: The key's thumbprint. }
                client_id: { type: string, description: '"" clears it.' }
                require: { type: boolean }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
                  subject: { type: string }
                  changes: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /settings/idp-token-rules:
    get:
      tags: [Agent protection]
      summary: How each identity provider's tokens are read
      operationId: listIdpTokenRules
      x-stability: preview
      responses:
        "200":
          description: Rules per provider, and the install's defaults.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules: { type: object, additionalProperties: { $ref: "#/components/schemas/IdpTokenRule" } }
                  default_mfa_acr_values: { type: array, items: { type: string } }
                  install_allows_password_grant: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /settings/idp-token-rules/{providerId}:
    parameters:
      - name: providerId
        in: path
        required: true
        schema: { type: string }
        description: An SSO provider's id.
    put:
      tags: [Agent protection]
      summary: Change how one provider's tokens are read
      operationId: setIdpTokenRule
      x-stability: preview
      description: |
        Send only what changes; the rest is kept. Platform admin only. Audited
        as `IdpTokenRulesChanged`.

        ⚠ **`allow_password_grant: true` weakens delegation.** A password-grant
        token proves a password, not that the person signed in to this agent;
        the audit row says so with a warning.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdpTokenRule" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
                  id: { type: string }
                  rule: { $ref: "#/components/schemas/IdpTokenRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /settings/mfa:
    get:
      tags: [Agent protection]
      summary: Who must use MFA at sign-in
      operationId: getMfaPolicy
      x-stability: preview
      description: |
        The setting, and a preview of each choice: how many users it covers and
        **who would be locked out** — people it would require MFA of who have
        no identity-provider email to complete it with.
      responses:
        "200":
          description: Setting and preview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  required_for: { type: string, enum: [privileged, everyone] }
                  preview:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        mfa_users: { type: integer }
                        without_idp: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Agent protection]
      summary: Set who must use MFA
      operationId: setMfaPolicy
      x-stability: preview
      description: |
        ⚠ Read the preview's `without_idp` first: those people are locked out
        at their next sign-in. The break-glass account is exempt by design.
        Audited as `MfaPolicyChanged`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [required_for]
              properties:
                required_for: { type: string, enum: [privileged, everyone] }
      responses:
        "200":
          description: The setting and preview after the change.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A service-account JWT for automation, an exchanged token for an agent,
        or a token from `/auth/login` for interactive use. The token's `sub` is
        the identity every grant is keyed on; its optional `scopes` claim
        narrows what it may call at the gateway.

    inventoryToken:
      type: http
      scheme: bearer
      description: |
        A token minted in Inventory → Integration Tokens (`inventory:write`),
        pasted into the MDM. It can report what a device has, and enroll a
        device for its hook key; nothing else.
    deviceKey:
      type: http
      scheme: bearer
      description: |
        A device's own hook key (`mhk.…`, from `/endpoint/enroll`). It can ask
        `/endpoint/decide` about that device and nothing else; an admin can
        revoke it.

  parameters:
    Namespace:
      name: namespace
      in: path
      required: true
      schema: { type: string }
      example: mcp-prod
      description: |
        The tenant the request is for. The caller must be permitted to act in
        it; a namespace-confined principal addressing another namespace is
        refused, not given an empty result.
    ServerName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9-]{2,62}$"
      example: alpha-vantage
    HoldId:
      name: holdId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceAccountId:
      name: saId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: The account's `id` (its token's `jti`), not its `subject`.
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema: { type: string }
    TurnId:
      name: turnId
      in: path
      required: true
      schema: { type: string }
      description: The `X-Magertron-Turn-Id` of one user message (Volume 2, Chapter 31).
    PdpNamespace:
      name: ns
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9-]+$" }

  responses:
    Unauthorized:
      description: Missing, malformed or expired token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PdpScope:
      description: The namespaces that ask the PDP now.
      content:
        application/json:
          schema:
            type: object
            properties:
              namespaces: { type: string, example: "mcp-prod,netops", description: 'Comma list, or "*".' }
              namespaces_default: { type: string, description: "The install's --pdp-namespaces." }
              changed: { type: boolean }
    PdpNotConfigured:
      description: External Policy is not configured on this install.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    FeatureRequired:
      description: |
        This install's license does not include the feature. Not a permissions
        problem: no role unlocks it.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: Feature requires a paid license }
              feature: { type: string, example: webhooks }
              tier_required: { type: string, enum: [pro, enterprise] }
              upgrade_url: { type: string }
    Forbidden:
      description: Signed in, but not permitted to do this.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource in that namespace.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Validation failure; the body names the field and the value.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotLeader:
      description: |
        ⚠ **Not an error — retry it.** Mutating operations are leader-only and
        this replica is not the leader. `Retry-After: 1` is set; the load
        balancer routes the retry to a different pod.

        A client that treats this as a failure will appear to break
        intermittently on any multi-replica install. Every first-party client
        retries it (`mcpctl` and the regression suite both do), and yours
        should too — a handful of attempts with a short pause is sufficient.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying. Honour it rather than inventing a backoff.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: this orchestrator pod is not the current leader; retry the request
              hint:
                type: string
                example: the load balancer will route the retry to a different pod
              operation:
                type: string
                example: deploy_server
    TierCapacity:
      description: |
        The licence tier's server limit has been reached. The body carries the
        current count and the cap so a client can report the ceiling rather
        than the refusal.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              current: { type: integer }
              cap: { type: integer }
    InsufficientDisk:
      description: |
        The node's disk is at its critical threshold, so an operation that adds
        to it (deploy, scale up, model pull) was refused before it could take
        the control plane down. Free space or grow the disk, then retry.
        `"ignore_disk_guard": true` in the request body overrides (logged).
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, const: insufficient_disk }
              detail: { type: string }
              used_pct: { type: number }
              critical_pct: { type: number }
              avail_gb: { type: number }

  schemas:

    # ── VERIFIED against a live response, 2026-08-16 ────────────────────
    Server:
      description: |
        ⚠ **Two shapes, one endpoint.** An `internal` server is image-backed
        and carries deployment fields; an `external` server is endpoint-backed
        and carries auth fields. `server_type` discriminates, and a client that
        assumes one shape will find fields missing on the other.
      oneOf:
        - $ref: "#/components/schemas/InternalServer"
        - $ref: "#/components/schemas/ExternalServer"
      discriminator:
        propertyName: server_type
        mapping:
          internal: "#/components/schemas/InternalServer"
          external: "#/components/schemas/ExternalServer"

    ServerCommon:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        namespace: { type: string }
        server_type: { type: string, enum: [internal, external, hybrid] }
        state:
          type: string
          description: |
            `Running` is the serving state for internal servers; `Active` is
            the serving state for external ones. `Registered` means an external
            server awaits approval.
          enum: [Pending, Registered, Deploying, Probing, Running, Active, Inactive, Failed, ProbeFailed]
        deployed_by: { type: string }
        routing_mode: { type: string, example: v3 }
        group_name: { type: string }
        clone_of:
          type: string
          description: ⚠ Empty string when not a clone, not null.
          example: ""
        labels:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
        env_vars:
          type: object
          additionalProperties: { type: string }
        command:
          type: array
          items: { type: string }
        args:
          type: array
          items: { type: string }
        tools:
          type: array
          items: { $ref: "#/components/schemas/Tool" }
        health: { $ref: "#/components/schemas/Health" }

    InternalServer:
      allOf:
        - $ref: "#/components/schemas/ServerCommon"
        - type: object
          properties:
            image: { type: string, example: curtismager20/mcp-docs }
            image_tag: { type: string, example: v1 }
            transport: { type: string, enum: [streamable_http, sse, stdio] }
            upstream_path: { type: string, example: /mcp }
            mcp_port: { type: integer }
            cluster_port: { type: integer }
            cluster_ip:
              type: string
              description: ⚠ The literal string `"None"` when unset, not null.
              example: "None"
            replicas: { type: integer }
            min_replicas: { type: integer }
            max_replicas: { type: integer }
            cpu_request: { type: number }
            cpu_limit: { type: number }
            memory_request_mb: { type: integer }
            memory_limit_mb: { type: integer }

    ExternalServer:
      allOf:
        - $ref: "#/components/schemas/ServerCommon"
        - type: object
          properties:
            endpoint_url: { type: string, format: uri }
            auth_type:
              type: string
              enum: [none, bearer, api-key, oauth2-client-credentials, oauth2-authorization-code, mtls]
            credential_secret_ref:
              type: string
              description: |
                Kubernetes Secret holding the credential. For DCR servers the
                platform creates `{name}-dcr-creds` itself.
            credential_mode:
              type: string
              enum: [centralized, delegated]
              description: |
                `centralized` uses one operator-held credential for all callers.
                `delegated` obtains a per-user token via OAuth, so the vendor
                sees the end user rather than the platform.
            tls_min_version: { type: string, example: tls1_2 }
            upstream_http_version: { type: string, example: http1 }

    Health:
      type: object
      description: |
        Live figures for internal servers, filled by the platform's health
        monitor. ⚠ On builds before 2026-10-05, one server whose Deployment had
        disappeared stopped the monitor for every server after it, leaving all
        zeros; those builds also left new internal servers in `Deploying`.
      properties:
        liveness: { type: boolean }
        readiness: { type: boolean }
        ready_replicas: { type: integer }
        total_replicas: { type: integer }
        cpu_usage_pct: { type: number }
        memory_usage_pct: { type: number }
        requests_per_second: { type: integer }
        error_count_1m: { type: integer }

    Tool:
      type: object
      description: A tool as discovered from the server, not as declared.
      properties:
        name: { type: string }
        description: { type: string }
        category: { type: string }
        read_only:
          type: boolean
          description: |
            ⚠ Reported by the server. Governance can warn on mutating tools,
            but the value is only as accurate as the server's own declaration.
        idempotent: { type: boolean }
        injection_flagged:
          type: boolean
          description: Set when the description was flagged as a possible prompt-injection vector.
        injection_reason: { type: string }
        input_schema:
          type: object
          description: The tool's own JSON Schema, passed through unmodified.
          additionalProperties: true

    # ── INFERRED — check against a live response before publishing ──────
    Role:
      type: object
      properties:
        id: { type: string, example: system:mcp-consumer }
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        allowed_namespaces:
          type: array
          items: { type: string }
          description: |
            The tenants this role may act in. `["*"]` is unconfined.

            ⚠ Separate from, and evaluated independently of, the namespace on
            each permission. Confinement answers "is this tenant visible at
            all"; the permission answers "may this verb be used here". Both
            must pass.
        is_admin_tier:
          type: boolean
          description: |
            Whether the role counts toward the admin-tier ceiling. Compliance
            controls bound how many such roles may exist.
        system_role:
          type: boolean
          description: |
            ⚠ Built-in, defined in the platform itself. Do not create a custom
            role whose `id` shadows one — the resolver and this API would then
            describe different access.

    Permission:
      type: object
      description: |
        One grant: a set of verbs, on a resource type, in a namespace.

        ⚠ **Both `resource_type` and `actions` are numeric.** They are the
        platform's internal enum values, exposed as-is. Decode them with the
        tables below; do not guess from ordering.
      properties:
        resource_type:
          type: integer
          description: |
            | Value | Resource |
            |---|---|
            | 0 | MCPServer |
            | 1 | MCPGroup |
            | 2 | GatewayRoute |
            | 3 | AuditLog |
            | 4 | Role |
            | 5 | Policy |
          enum: [0, 1, 2, 3, 4, 5]
          example: 0
        resource_name:
          type: string
          description: '`"*"` matches every resource of that type.'
          example: "*"
        namespace:
          type: string
          description: '`"*"` matches every namespace.'
          example: mcp-csis
        actions:
          type: integer
          format: uint32
          description: |
            ⚠ **A BITMASK, not a single value.** Combine with bitwise OR; test
            with bitwise AND. `actions: 5` is `Read | Deploy`, not "action 5".

            | Bit | Value | Action |
            |---|---|---|
            | 0 | 1 | Read |
            | 1 | 2 | Write |
            | 2 | 4 | Deploy |
            | 3 | 8 | Undeploy |
            | 4 | 16 | Scale |
            | 5 | 32 | ViewLogs |
            | 6 | 64 | ManageRoles |
            | 7 | 128 | ManageGateway |
            | 8 | 256 | AuditRead |
            | 9 | 512 | BillingRead |
            | 10 | 1024 | BillingWrite |

            `0` is None; `4294967295` (0xFFFFFFFF) is All.
          example: 1

    CreateRole:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: custom:portal-user
          description: ⚠ Do not use a `system:` prefix — those are reserved for built-ins.
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        allowed_namespaces:
          type: array
          items: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email:
          type: string
          format: email
          description: |
            Contact address. ⚠ Distinct from `sso_email`: this is stable and
            operator-set, that one is whatever the IdP returned.
        sso_email:
          type: string
          format: email
          description: Binds the account to an IdP-provided identity.
        roles:
          type: array
          items: { type: string }
        enabled: { type: boolean }
        provisioned_via:
          type: string
          enum: [password, sso_jit, scim]
          description: |
            How the account came into being. SCIM-managed fields are read-only
            in the admin UI.
        created_at:
          type: string
          description: |
            ⚠ **A unix epoch, as a STRING** — e.g. `"1780679568"`. Not ISO-8601,
            and not a number. `last_used_at` on the same object IS ISO-8601;
            the two are inconsistent and this document records that rather than
            hiding it.
          example: "1780679568"
        last_used_at:
          type: string
          format: date-time
          description: ISO-8601, unlike `created_at`.
          example: "2026-08-14T12:27:33Z"

    CreateUser:
      type: object
      required: [username, password, roles]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        email:
          type: string
          format: email
          description: ⚠ Set it. See the operation description.
        roles:
          type: array
          items: { type: string }

    CreateInternalServer:
      type: object
      required: [type, name, namespace, image]
      properties:
        type: { type: string, const: internal }
        name:
          type: string
          pattern: "^[a-z][a-z0-9-]{2,62}$"
        namespace:
          type: string
          description: |
            ⚠ Required — not defaulted. The Kubernetes namespace is created if
            it does not already exist.
        image: { type: string }
        image_tag: { type: string, default: latest }
        mcp_port: { type: integer, minimum: 1, maximum: 65535 }
        upstream_path: { type: string, default: "/mcp" }
        transport:
          type: string
          enum: [streamable_http, sse, stdio]
          default: streamable_http
          description: |
            ⚠ `stdio` is refused by the default internal policy — it is not
            permitted for a governed server.
        replicas: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        cpu_limit: { type: number }
        memory_limit_mb: { type: integer }
        labels:
          type: object
          additionalProperties: { type: string }
          description: |
            ⚠ If the `enterprise-standard` governance policy is enabled, a
            `team` label is required and registration without one is refused.
        command:
          type: array
          items: { type: string }
        args:
          type: array
          items: { type: string }
        env_vars:
          type: object
          additionalProperties: { type: string }
        ignore_disk_guard:
          type: boolean
          default: false
          description: |
            Deploy even when the node's disk is critical. For emergencies;
            logged. See `GET /admin/disk/health`.

    CreateExternalServer:
      type: object
      required: [type, name, namespace, endpoint_url, auth_type]
      properties:
        type: { type: string, const: external }
        name:
          type: string
          pattern: "^[a-z][a-z0-9-]{2,62}$"
        namespace:
          type: string
          description: |
            ⚠ Required — not defaulted. The Kubernetes namespace is created if
            it does not already exist.
        endpoint_url: { type: string, format: uri }
        auth_type:
          type: string
          enum: [none, bearer, api-key, oauth2-client-credentials, oauth2-authorization-code, mtls]
        credential_secret_ref:
          type: string
          description: |
            Required for every auth type except `none` and
            `oauth2-authorization-code`. For the latter the platform performs
            dynamic client registration and creates `{name}-dcr-creds` itself —
            if the vendor advertises no protected-resource metadata, discovery
            fails and registration returns 400.
        credential_mode:
          type: string
          enum: [centralized, delegated]
          default: centralized
        labels:
          type: object
          additionalProperties: { type: string }

    Budget:
      type: object
      description: |
        A spend cap and its current consumption. The read side carries live
        figures, so a client can report headroom rather than only the ceiling.
      properties:
        id: { type: string, format: uuid }
        scope_type: { type: string, example: server }
        server_id: { type: string, format: uuid }
        threshold_pct:
          type: [number, "null"]
          description: |
            Percentage of the contractual commitment at which traffic is
            refused. Null when the budget is absolute-only.
        limit_usd:
          type: [number, "null"]
          description: |
            Absolute ceiling in USD. Applied alongside `threshold_pct`; when
            both are set the stricter wins. Null when percentage-only.
        budget_amount_usd:
          type: [number, "null"]
          description: The resolved ceiling in dollars, whichever rule produced it.
        commitment_usd:
          type: number
          description: |
            The server's contractual commitment, which `threshold_pct` is a
            percentage OF. ⚠ Zero when no contract carries one — in which case
            a percentage-anchored budget has nothing to anchor to and the
            absolute limit is the only usable rule.
        usage_usd:
          type: number
          description: Spend in the current billing period.
        pct_consumed:
          type: [number, "null"]
          description: Usage as a percentage of the commitment. Null when there is no commitment.
        over_budget:
          type: boolean
          description: |
            Whether the cap is currently exceeded. ⚠ Reflects the rating
            engine's view, which the gateway's enforcement cache trails by
            roughly 45 seconds.
        override:
          type: boolean
          description: When true the budget is recorded and visible but not enforced.
        created_by: { type: string }

    PutBudget:
      type: object
      description: |
        At least one of `threshold_pct` or `limit_usd` is required; send both and
        the stricter applies. An absolute-only budget (just `limit_usd`) is the
        only usable kind on a server whose contract carries no commitment.
        Numbers or numeric strings are accepted (console forms send strings).
        `budget_amount_usd` is accepted as a legacy name for `limit_usd`.
      properties:
        threshold_pct: { type: [number, string, "null"], minimum: 0, maximum: 100 }
        limit_usd: { type: [number, string, "null"], minimum: 0 }
        override: { type: boolean, default: false }

    CreateToolPermission:
      type: object
      required: [role_id, pattern_type, tool_pattern, effect]
      properties:
        role_id: { type: string }
        pattern_type:
          type: string
          enum: [EXACT, WILDCARD, REGEX]
        tool_pattern:
          type: string
          example: "*"
        effect:
          type: string
          enum: [ALLOW, DENY]
          description: ⚠ DENY wins over ALLOW when both match.
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        reason:
          type: string
          description: Appended to the gateway's denial when this rule refuses a call — callers read it.

    ToolPermission:
      allOf:
        - $ref: "#/components/schemas/CreateToolPermission"
        - type: object
          properties:
            id: { type: string, format: uuid }
            server_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            created_by: { type: string }

    MeterEvent:
      type: object
      description: |
        Preview. One measure of one call. A call writes one row per dimension;
        `billing_group_id` ties a call's rows together.
      properties:
        incurred_at: { type: string, format: date-time }
        caller_user_id:
          type: string
          description: The identity that authenticated — the agent, on a delegated call.
        caller_type: { type: string, enum: [user, service_account] }
        caller_display:
          type: string
          description: '`<person> · via <agent>` on a delegated call.'
          example: "zuraiz-user@example.com · via zuraiz-path-a"
        on_behalf_of:
          type: string
          description: The person a delegated call was made for. Empty on a direct call.
        dept_id: { type: string }
        dept_name: { type: string }
        cost_center: { type: string }
        server_id: { type: string, format: uuid }
        server_name: { type: string }
        namespace: { type: string }
        tool_id: { type: string }
        method: { type: string }
        dimension: { type: string, example: calls }
        quantity: { type: number }
        amount_usd: { type: number }
        cost_state:
          type: string
          description: '`RATED` when a rate card priced this dimension; blank when nothing did.'
        status: { type: string, enum: [success, error] }
        session_id: { type: string }
        idempotency_key: { type: string }
        billing_group_id: { type: string, format: uuid }

    LoginToken:
      type: object
      properties:
        token: { type: string }
        username: { type: string }
        roles:
          type: array
          items: { type: string }
        mfa_bootstrap:
          type: boolean
          description: |
            True when an administrator logged in by password because no
            identity provider is connected yet (bootstrap mode). MFA is
            enforced once one is. Absent otherwise.

    LoginMfaChallenge:
      type: object
      description: |
        The account is on the two-phase MFA chain. Complete the IdP leg with
        the `pending` ticket. ⚠ Automation cannot proceed past this — use a
        service-account token instead.
      properties:
        mfa_required: { type: boolean, const: true }
        pending: { type: string }
        username: { type: string }
        providers:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }

    GovernanceRejection:
      type: object
      description: |
        ⚠ Read `violations`, not `error`. The top-level message says only that
        a policy refused; the array says which rule, on which field, with what
        value, and at what severity. Only `severity: error` entries block —
        warnings are advisory and the deployment proceeds.
      properties:
        allowed: { type: boolean, const: false }
        error: { type: string }
        error_count: { type: integer }
        warning_count: { type: integer }
        violations:
          type: array
          items:
            type: object
            properties:
              policy_name: { type: string }
              category: { type: string }
              field: { type: string }
              expected: { type: string }
              actual_value: { type: string }
              message: { type: string }
              severity: { type: string, enum: [error, warning] }

    Error:
      type: object
      properties:
        error: { type: string }
        detail: { type: string }
        hint: { type: string }

    # ── AI Estate (preview, from the handlers, 2026-11-24) ──────────────
    FleetSyncRequest:
      type: object
      required: [client, device_id, hostname, collected_at]
      properties:
        client:
          type: string
          description: |
            One of claude-desktop, claude-code, cursor, vscode, windsurf, devin,
            gemini-cli, cline, roo-code, kiro, amazon-q, codex, zed, continue,
            goose, claude-code-project. Only some are ever rewritten; see
            `rewrite_supported` in the response.
        device_id: { type: string, description: "Platform UUID / MachineGuid, so a rename is the same device." }
        hostname: { type: string }
        user: { type: string, description: The console user the script saw. A claim. }
        mdm: { type: string, default: unknown, description: "jamf | intune | ansible | manual | …" }
        host_os: { type: string }
        config_path: { type: string }
        config_sha256: { type: string, description: SHA-256 of the original file, before masking. }
        config_contents: { type: string, description: The config as JSON text, secrets masked. }
        collected_at: { type: string, format: date-time }
        hooks_state:
          type: string
          enum: [installed, none]
          description: Were the agent hooks on this device when the run started?
        hooks_agents:
          type: string
          example: claude-code,cursor,codex
          description: |
            Fleet script 0.7.1+. Which agents the hooks are registered with,
            comma-separated. Unknown names are dropped.
    FleetSyncResponse:
      type: object
      properties:
        mode: { type: string, enum: [observe, advise, enforce] }
        declared: { type: integer, description: Servers the config declares. }
        observed: { type: integer, description: Sightings recorded. }
        gateway: { type: integer, description: Declared servers routed through the gateway. }
        stale: { type: integer, description: Gateway-shaped routes no longer served. }
        rewrite_supported: { type: boolean }
        rewrite:
          description: Null under observe, or when this client is not rewritten.
          oneOf:
            - type: "null"
            - type: object
              properties:
                path: { type: string }
                contents: { type: string }
                servers: { type: integer }
        endpoint_hooks:
          type: object
          description: What the script should install. The rules stay server-side.
          properties:
            mode: { type: string, enum: [off, observe, enforce] }
            fail: { type: string, enum: [open, closed] }
    InventoryAgent:
      type: object
      properties:
        agent_id: { type: string, description: The token subject the device reports under. }
        host_id: { type: string }
        hostname: { type: string }
        claimed_user: { type: string }
        host_os: { type: string }
        host_os_version: { type: string }
        agent_version: { type: string, description: "How it reports: jamf | intune | manual | …" }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        last_observation_count: { type: integer }
        hooks_state:
          type: string
          example: installed:claude-code,cursor,codex
          description: |
            `installed`, `none`, or (fleet script 0.7.1+) `installed:` followed
            by the agents the hooks are registered with. Absent before 0.3.1.
        hooks_seen_at: { type: string, format: date-time }
    DeviceServer:
      type: object
      properties:
        declared_name: { type: string }
        config_path: { type: string }
        client: { type: string }
        route: { type: string, enum: [gateway, gateway_stale, direct, ""] }
        transport: { type: string }
        command: { type: string }
        endpoint_url: { type: string }
        server_id: { type: string }
        server_name: { type: string }
        server_state: { type: string }
        server_origin: { type: string }
        last_seen_at: { type: string, format: date-time }
    EndpointHookRule:
      type: object
      required: [id, tool, match, action]
      properties:
        id: { type: string }
        tool:
          type: string
          example: Read|Write|Edit|MultiEdit
          description: Regular expression over the tool name, in Claude Code's vocabulary.
        match: { type: string, description: Regular expression over the command, path, URL or query. }
        action: { type: string, enum: [allow, ask, deny, hold] }
        reason: { type: string, description: Shown to the developer and the agent. }
        approvers:
          type: array
          items: { type: string }
          description: "hold only: who may approve. Empty = namespace admins."
    EndpointHookPolicy:
      type: object
      properties:
        mode:
          type: string
          enum: [off, observe, enforce]
          default: "off"
          description: off removes the hooks at next check-in; observe records only; enforce blocks.
        fail:
          type: string
          enum: [open, closed]
          default: open
          description: What the hook does when Magertron™ is unreachable.
        rules:
          type: array
          items: { $ref: "#/components/schemas/EndpointHookRule" }
          description: First match wins. A new install starts with five starter rules.
        hold_wait_seconds: { type: integer, minimum: 0, maximum: 100, default: 60 }
        hold_ttl_seconds: { type: integer, minimum: 60, maximum: 86400, default: 900 }
        allow_audit:
          type: string
          enum: [summary, all]
          default: summary
          description: summary writes one count per device every 5 minutes instead of a row per allow.
        device_rate_per_minute:
          type: integer
          minimum: 0
          maximum: 100000
          default: 600
          description: |
            Most decisions one device may ask for in a minute; 0 = no limit.
            ⚠ Counted per orchestrator replica, so N replicas allow up to N ×
            the limit.
    EndpointDecideRequest:
      type: object
      properties:
        agent: { type: string, enum: [claude-code, cursor, codex, gemini, windsurf, copilot] }
        tool: { type: string, example: Bash, description: Required unless ping. }
        subject: { type: string, maxLength: 2000, description: "The command, path, URL or query. Never file contents." }
        cwd: { type: string }
        device_id: { type: string, description: Ignored with a device key. }
        hostname: { type: string }
        user: { type: string }
        hold_id: { type: string, description: Re-asking about a hold this call opened. }
        ping: { type: boolean, description: Only check that the key works. }
    EndpointDecision:
      type: object
      properties:
        decision: { type: string, enum: [allow, ask, deny, hold] }
        would:
          type: string
          enum: [allow, ask, deny, hold]
          description: What enforce would answer. Differs from decision in observe mode.
        device_id: { type: string }
        mode: { type: string, enum: [off, observe, enforce] }
        fail: { type: string, enum: [open, closed] }
        rule: { type: string, description: "The matching rule's id, or rate-limit." }
        reason: { type: string }
        hold_id: { type: string }
        approvers: { type: array, items: { type: string } }
        wait_seconds: { type: integer, description: How long the hook should wait for an approval. }
        ok: { type: boolean, description: ping only. }

    # ── Holds (preview) ─────────────────────────────────────────────────
    Hold:
      type: object
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        namespace: { type: string, description: "`_endpoint` for a laptop hold." }
        server: { type: string, description: The server, or the laptop for a laptop hold. }
        tool: { type: string }
        subject: { type: string, description: Who made the call (`device:<id>` for a laptop). }
        on_behalf_of: { type: string, description: The person the call was for. }
        reason: { type: string }
        state: { type: string, enum: [pending, approved, declined, consumed, expired] }
        approvers: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        decided_by: { type: string }
        decided_at: { type: string, format: date-time }
        decision_note: { type: string }
    HoldDecision:
      type: object
      properties:
        note: { type: string, description: Kept with the decision; a decline shows it to the requester. }

    # ── Service accounts (preview, from the handlers, 2026-11-24) ───────
    ServiceAccount:
      type: object
      properties:
        id: { type: string, format: uuid, description: "The current token's jti. Changes on rotate." }
        organization_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        subject: { type: string, description: "The token's sub. Permanent." }
        role_ids: { type: array, items: { type: string } }
        scopes: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: Most recent audited activity; null if none.
        reminder_sent_at: { type: string, format: date-time, description: When the expiry reminder webhook fired. }
        owner_email: { type: string, description: The person to remind before expiry. }
        external_id: { type: string, description: "The IdP's identifier for this agent, e.g. Auth0 <client_id>@clients." }
        created_by: { type: string }
    ServiceAccountWithToken:
      allOf:
        - $ref: "#/components/schemas/ServiceAccount"
        - type: object
          properties:
            token:
              type: string
              description: The JWT. Shown once — store it now; it cannot be read back.
    CreateServiceAccount:
      type: object
      required: [name, subject, organization_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        subject:
          type: string
          pattern: "^[a-z0-9_-]{1,128}$"
          description: Becomes the token's sub. Permanent — every grant is keyed on it.
        organization_id: { type: string, format: uuid, description: "From GET /orgs." }
        description: { type: string }
        role_ids: { type: array, items: { type: string }, example: ["system:deploy-manager"] }
        scopes:
          type: array
          items: { type: string }
          description: |
            Narrows what the token may call at the gateway: `*`,
            `tool:<tool>`, `tool:<ns>/<server>/<tool>` or `server:<ns>/<server>`.
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 157680000
          default: 7776000
          description: Default 90 days, at most 5 years. 0 means the default.
        owner_email: { type: string, format: email }
        external_id: { type: string, maxLength: 255, description: No spaces. }
    PatchServiceAccount:
      type: object
      description: Any of these. Immutable fields are refused with 400.
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { type: string }
        role_ids: { type: array, items: { type: string } }
        scopes: { type: array, items: { type: string } }
        owner_email: { type: string, description: '"" clears it.' }
        external_id: { type: string, description: '"" clears it. 409 if another account holds it.' }

    # ── Webhooks (preview) ──────────────────────────────────────────────
    Webhook:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        event_types:
          type: array
          items: { type: string }
          description: See WebhookWrite.
        namespaces: { type: array, items: { type: string } }
        enabled: { type: boolean }
        created_at: { type: string }
        updated_at: { type: string }
    WebhookWrite:
      type: object
      required: [name, url]
      properties:
        name: { type: string, description: Make it unique — create returns the name, not the id. }
        url:
          type: string
          description: |
            http or https, public addresses only. A URL containing `slack`
            gets a short text message instead of the JSON payload.
        secret:
          type: string
          description: |
            Signs every delivery: `X-MCP-Signature: sha256=<hex>`, HMAC-SHA256
            of the raw body — the same scheme as GitHub's, so existing
            verification code works. Without one, deliveries are unsigned.
        event_types:
          type: array
          items:
            type: string
            enum: ["*", Deployed, Undeployed, Scaled, Updated, Failed, HealthChange,
                   HoldOpened, HoldApproved, HoldDeclined, ServiceAccountExpiringSoon]
          default: ["*"]
        namespaces:
          type: array
          items: { type: string }
          default: ["*"]
          description: Laptop holds are namespace `_endpoint`.
        enabled: { type: boolean, default: true }
    WebhookDelivery:
      description: |
        What your endpoint receives (`POST`, `application/json`). Only the
        leader replica delivers, so each event arrives once; a failed delivery
        is retried three times with backoff.

        ⚠ **Two envelopes.** Server lifecycle events name themselves in
        `event`; every other event (holds, service-account expiry) in
        `event_type`. Read both.
      oneOf:
        - title: Server lifecycle
          type: object
          properties:
            event: { type: string, enum: [Deployed, Undeployed, Scaled, Updated, Failed, HealthChange, Test] }
            server: { type: string }
            namespace: { type: string }
            actor: { type: string }
            detail: { type: string }
            state: {}
            timestamp: { type: string, format: date-time }
            platform: { type: string, const: mcp-orchestrator }
        - title: Hold
          type: object
          properties:
            event_type: { type: string, enum: [HoldOpened, HoldApproved, HoldDeclined] }
            hold_id: { type: string }
            state: { type: string }
            reason: { type: string }
            namespace: { type: string }
            server: { type: string }
            tool: { type: string }
            agent: { type: string }
            on_behalf_of: { type: string }
            approvers: { type: array, items: { type: string } }
            arguments: {}
            created_at: { type: string }
            expires_at: { type: string }
            decided_by: { type: string }
            decided_at: { type: string }
            decision_note: { type: string }
            approve_path: { type: string, example: /api/v1/holds/3f2c…/approve }
            decline_path: { type: string }
            summary: { type: string, description: One readable line — what Slack shows. }
            timestamp: { type: string, format: date-time }
            platform: { type: string, const: mcp-orchestrator }

    # ── Audit (preview) ─────────────────────────────────────────────────
    AuditEvent:
      type: object
      description: Optional fields are omitted when empty.
      properties:
        id: { type: integer }
        event_uid: { type: string }
        plane: { type: string, description: "gateway, admin, …" }
        kind: { type: string, example: ToolInvoked }
        class_uid: { type: integer, description: OCSF class. }
        activity_id: { type: integer }
        severity_id: { type: integer }
        status_id: { type: integer }
        status_detail: { type: string }
        server_name: { type: string }
        namespace: { type: string }
        tool_name: { type: string }
        actor: { type: string, description: Who authenticated — the agent, on a delegated call. }
        actor_email: { type: string }
        actor_session_id: { type: string }
        actor_idp: { type: string }
        actor_roles: { type: array, items: { type: string }, description: Roles held at the time. }
        on_behalf_of_subject: { type: string, description: The person an agent acted for. }
        detail: { type: string, description: "The reason, verbatim — its prefix names which gate decided." }
        occurred_at: { type: string, example: "1764021600", description: "⚠ Unix seconds, as a string." }
        src_ip: { type: string }
        src_user_agent: { type: string }
        request_id: { type: string }
        turn_id: { type: string }
        prompt: { type: string, description: Present only while prompt recording is on. }
        is_model: { type: boolean, description: "Always present: true for a model call, false for a tool call." }
        tenant: { type: string }
        cluster_uid: { type: string }
        old_state: {}
        new_state: {}
        unmapped: { type: object, additionalProperties: true, description: "Kind-specific fields, e.g. unmapped.endpoint on agent-hook decisions." }
        securable_name: { type: string }
        securable_type: { type: string }
        securable_id: { type: string }
    AuthorityRecord:
      type: object
      additionalProperties: true
      description: Volume 2, Chapter 33 describes every section.
      properties:
        turn_id: { type: string }
        as_of: { type: string, description: When the decision happened. }
        generated_at: { type: string, description: When this record was assembled. }
        principal: { type: object, additionalProperties: true, description: "subject, on_behalf_of, roles at the time." }
        events: { type: array, items: { type: object, additionalProperties: true }, description: Every audit row of the turn, detail verbatim. }
        authority: { type: array, items: { type: object, additionalProperties: true }, description: Permissions and role definitions in force at as_of. }
        data_reach: { type: array, items: { type: object, additionalProperties: true } }
        constraints: { type: object, additionalProperties: true }
        environment: { type: object, additionalProperties: true }
        coverage: { type: object, additionalProperties: true, description: Read before concluding anything from an absence. }
        exchange_bounded: { type: boolean, description: "true: an inferred turn; this record is a slice." }
        signature: { type: string }
        key_id: { type: string }
        key_shared_with_jwt: { type: boolean }

    # ── External policy, PII, agent protection (preview, 2026-11-24) ────
    PdpData:
      type: object
      description: What the policy reads as `data.allowances` and `data.department_budgets_usd`.
      properties:
        allowances:
          type: object
          properties:
            people:
              type: object
              additionalProperties: true
              description: Keyed by Magertron username.
          additionalProperties: true
        department_budgets_usd:
          type: object
          additionalProperties: { type: number }
          description: Keyed by department name.
      additionalProperties: true
    PiiMode:
      type: string
      enum: ["off", detect, redact, block]
    PiiType:
      type: string
      enum: [secret, iban, card, ssn, email, phone, ip, person, location, nrp, passport,
             driver_license, bank_account, itin, date]
    ServerPii:
      type: object
      properties:
        mode: { type: string, enum: [default, "off", detect, redact, block] }
        types: { type: array, items: { $ref: "#/components/schemas/PiiType" } }
        default_mode: { $ref: "#/components/schemas/PiiMode" }
        effective_mode: { $ref: "#/components/schemas/PiiMode" }
        detector: { type: string, enum: [regex, presidio] }
        all_types: { type: array, items: { $ref: "#/components/schemas/PiiType" } }
        default_types: { type: array, items: { $ref: "#/components/schemas/PiiType" } }
        presidio_types: { type: array, items: { $ref: "#/components/schemas/PiiType" } }
    AgentProtection:
      type: object
      required: [namespace]
      properties:
        namespace: { type: string, description: A namespace with servers in it. }
        require_person: { type: boolean, description: Refuse a service account calling with no person behind it. }
        bound_delegation: { type: boolean, description: Refuse a delegation the platform did not bind at token exchange. }
        require_mfa: { type: boolean, description: Refuse a delegation whose person did not show MFA. }
        require_dpop: { type: boolean, description: Refuse tokens not bound to the agent's key (DPoP). }
    IdpTokenRule:
      type: object
      properties:
        client_claim: { type: string, enum: [auto, azp, client_id, cid, appid], description: Which claim names the agent's client. }
        mfa_acr_values: { type: array, items: { type: string }, description: acr values that count as MFA for this provider. }
        allow_password_grant: { type: boolean }
        trusted_clients: { type: array, items: { type: string } }
