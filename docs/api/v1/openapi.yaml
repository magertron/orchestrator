openapi: 3.1.0

# =============================================================================
# Magertron Platform API — v1
#
# ⚠ SCOPE. The orchestrator registers ~101 routes under /api/v1. This document
# describes the SUBSET that is intended for customer automation. Endpoints
# without `x-stability: preview` have response shapes asserted by the
# regression suite; preview endpoints are documented from the handlers and may
# still change. An endpoint's absence here does not mean it is unavailable — it
# means it is not yet a contract.
#
# ⚠ PROVENANCE. Every non-preview response schema here was taken from a LIVE
# response on 2026-08-16, not from reading the handlers. That matters: a first
# draft built from the request side got four things wrong — three endpoints
# wrap their results in an envelope rather than returning a bare array,
# Role.permissions is a structured object rather than a list of names, Budget
# carries live consumption fields, and User reports two different timestamp
# formats. Preview endpoints (added 2026-10-05) were documented from the
# handlers and a design partner's live trial; they carry the marker until a
# test pins their shape.
#
# ⚠ Where the API is inconsistent, this document says so rather than tidying it
# up. A spec that describes what you wish you had shipped is worse than none.
#
# NOT IN v1, deliberately:
#   * Unity Catalog (/api/v1/uc/...). Substantial and well-tested, but newer —
#     held for v2 rather than frozen early.
#   * Governance policy CRUD. Configured in the UI; not an automation surface.
#   * Service-account and contract CRUD — used by the console, documented next.
# =============================================================================

info:
  title: Magertron™ Platform API
  version: "1.1.0"
  summary: Governed control plane for MCP servers, agents and their traffic.
  description: |
    Magertron™ sits between agents and the MCP servers, LLM providers and REST
    APIs they call. This API is the automation surface for the control plane:
    registering and approving servers, provisioning roles and users, setting
    tool-level permissions, capping spend — and, in preview, the endpoints an
    agent developer needs: token exchange, the developer portal, and metering.

    ## Failure modes every client must handle

    **503 — not the current leader.** Mutating operations are leader-only, and
    the service load-balances across replicas. On a multi-replica install a
    write lands on a follower roughly half the time and is refused with a 503
    carrying `Retry-After: 1`. **Retry it.** The load balancer will route the
    retry elsewhere. This is not an error condition; it is the documented
    protocol, and a client that does not retry will appear to fail
    intermittently for no reason. Read operations are served by any replica and
    do not have this behaviour.

    **402 — tier capacity.** Server registration is capped per licence tier.
    The response body carries the current count and the cap, so a client can
    report the limit rather than the refusal.

    **400 — validation.** Field-level, with the offending value named. See each
    operation for its ranges.

    **404 — no such route.** Any unmatched path under `/api/`, `/mcp/` or
    `/healthz` returns `404` with `{"error":"not_found","detail":"No API route
    matches <path>"}`. (Builds before 2026-10-05 answered unmatched API paths
    with `200` and the console's HTML, so a typo read as success.)

    **500 — database errors are never echoed.** When a request fails inside the
    database, the response says `database error (ref <8 hex>; details in the
    server log)`. Quote the ref to your operator; the full message is logged
    against it. Validation and parse errors keep their specific messages.

    ## Authentication

    **Password login** (`POST /auth/login`) is for people. Once an identity
    provider is connected, administrator accounts are on a two-phase MFA chain:
    login returns `mfa_required` with a pending ticket rather than a token, and
    cannot be scripted.

    ⚠ **Bootstrap mode.** On an install with **no identity provider connected
    yet**, an administrator's password login returns a token directly, with
    `mfa_bootstrap: true` in the response, and the audit log records a
    `BootstrapAdminLogin` event ("privileged password login with no IdP
    configured"). MFA is enforced as soon as an IdP exists. Treat bootstrap as
    an install-time state: connect an identity provider before production use.

    **Service-account tokens** are what automation uses: a signed JWT carrying
    `scope_kind=service_account`, with no interactive MFA step. Create the
    service account and its key in the admin UI, then present the token as
    `Authorization: Bearer <jwt>`.

    **Exchanged tokens** (`POST /token/exchange`, preview) are what an agent
    uses: an RFC 8693 exchange that turns the agent's own token — and, when
    acting for someone, that person's token — into a five-minute credential.

    ⚠ The token's `sub` is the identity every grant is keyed on. Delegated
    OAuth in particular matches on an exact `sub`, and a mismatch returns
    `consent_required` — which reads as "nobody authorized this" rather than
    "you authorized a different principal".

    ### Token scopes

    A token may carry a `scopes` claim that **narrows** what it can call at the
    gateway. A call must be allowed by the principal's roles **and** match one
    of the token's scopes; scopes never widen access.

    | Scope | Allows |
    |---|---|
    | `*` | everything the roles allow |
    | `tool:<glob>` | tools matching the glob, e.g. `tool:get_system_time`, `tool:search_*` |
    | `server:<ns>/<name>` | ⚠ not matched yet — a token whose only scopes are `server:` is refused |

    Scopes for other services in the same claim (e.g. `inventory:read`) do not
    affect gateway calls. Service accounts get scopes from their *Scopes*
    field; the developer portal mints tool-scoped tokens (`POST /portal/token`).
    Before 2026-10-05 the claim was written but not enforced.

    ### Gateway denials

    Tool calls go through the MCP gateway (`/mcp/{ns}/{name}/`), not this API,
    but their refusals have one documented shape worth keying on:

    ```
    403 ext_authz: No permission for tool '<tool>'. Principal '<sub>' has roles [<roles>]. Reason: <admin's text, when the rule has one>
    ```

    The prefix `No permission for tool` is stable; the `Reason:` text is
    whatever an administrator wrote on the rule and must not be parsed.

    ## Namespaces

    There is **no endpoint to create or delete namespaces**, and no namespace
    editor in the admin UI — namespaces are not managed as objects.

    A namespace comes into being when a server is registered into it: you name
    it **explicitly**, in the deploy wizard or in `POST /servers`, and the
    platform creates the Kubernetes namespace if it does not already exist.

    `namespace` is **required** on registration — it is not defaulted, so
    omitting it is a 400.

    `GET /namespaces` lists the ones the caller may act in.

    ## What v1 commits to

    These are the platform's core operations — registering a server, granting a
    role, capping spend. They are the oldest and least volatile part of the
    surface, and we do not expect them to change.

    **Within v1:**

    * An existing field will not be removed, renamed, or change type.
    * New **optional** fields may be added to responses. Your client must
      ignore fields it does not recognise — that is the only forward
      compatibility this promise requires of you.
    * New optional request fields may be added. Existing requests keep working.
    * Status codes for a given outcome will not change.

    Operations marked `x-stability: preview` are **excluded from these
    promises** until a regression test pins their shape. They are documented
    because developers need them now; expect additive changes.

    **Breaking changes go to `/api/v2`.** When v2 ships, **v1 remains
    supported for 12 months** from that date.

    ⚠ **What is NOT covered.** The orchestrator registers roughly a hundred
    routes under `/api/v1/`. This document describes thirty operations across
    twenty-five paths, six of them in preview. The rest are reachable, and some are useful, but they carry no
    contract and may change in any release without notice. In particular:

    * `/api/v1/uc/...` — Unity Catalog. Substantial and well-tested, but newer;
      held for v2 rather than frozen early.
    * Service-account and contract creation — console-driven today.
    * Governance policy CRUD, drift, and the assistant endpoints.

    If you need one of those, say so — the bar for adding an endpoint to v1 is
    a test that pins its shape, not a decision that it seems stable.

    ⚠ **Two things this document freezes, deliberately.** `Permission` exposes
    the platform's internal enum ordinals: `resource_type` values and the
    `actions` bitmask. Publishing them means those numbers can never be
    reordered or reassigned. And three endpoints wrap their results in an
    envelope while two return bare arrays — an inconsistency recorded here
    rather than tidied, because changing it now would break the very clients
    this document exists to enable.

  contact:
    name: Magertron
    url: https://magertron.com
  license:
    name: Proprietary

servers:
  - url: https://{host}:{port}/api/v1
    description: Orchestrator API. UI, REST API and the MCP gateway share one port.
    variables:
      host:
        default: app.magertron.com
      port:
        default: "30444"
        description: |
          NodePort installs default to 30444. `install.sh --node-port` overrides
          it; `kubectl get svc -n mcp-system` confirms what is listening.

security:
  - bearerAuth: []

tags:
  - name: Servers
    description: |
      Register, approve, inspect and remove MCP servers. The primary automation
      surface — provisioning from CI lives here.
  - name: RBAC
    description: Roles, users, and tool-level permissions.
  - name: Budgets
    description: Per-server spend caps enforced at the gateway.
  - name: Auth
    description: Obtaining a token.
  - name: Agents
    description: |
      Preview. What an agent developer needs: token exchange, the developer
      portal's catalog and token minting.
  - name: Billing
    description: Preview. Metering and contract cost reads.
  - name: Namespaces
    description: Enumerating tenants.
  - name: System
    description: Preview. Host health.

# =============================================================================
paths:

  # ─── Auth ───────────────────────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Exchange username and password for a token
      operationId: login
      security: []
      description: |
        For people, not automation. Once an identity provider is connected,
        accounts on the two-phase MFA chain — which includes administrators by
        policy — receive `mfa_required: true` and a `pending` ticket instead of
        a token, and must complete the IdP leg.

        ⚠ **Bootstrap mode:** with no identity provider connected, an
        administrator receives a token directly, marked `mfa_bootstrap: true`.
        See *Authentication* in the API description.

        **Automation should use a service-account token instead** and not call
        this endpoint at all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: |
            Either a token, or an MFA challenge. The two are distinguished by
            the presence of `mfa_required` — check it before reading `token`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LoginToken"
                  - $ref: "#/components/schemas/LoginMfaChallenge"
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ─── Agents (preview) ───────────────────────────────────────────────────
  /token/exchange:
    post:
      tags: [Agents]
      summary: Exchange a token for a short-lived Magertron credential (RFC 8693)
      operationId: tokenExchange
      x-stability: preview
      security: []
      description: |
        Trades an agent's token — and, to act for a person, that person's token
        — for a **five-minute** credential carrying both identities, signed.

        * Agent alone: send `subject_token` = the agent's token.
        * Acting for a person: `subject_token` = the **person's** token,
          `actor_token` = the **agent's** token. ⚠ The RFC's names read
          backwards: the subject is the human. Sending only a subject token is
          a valid, **undelegated** exchange — calls with it are attributed to
          the agent alone.

        Both tokens must carry the exchange audience your platform team
        configured (an id_token will not).

        **Non-delegable roles.** If the person holds a non-delegable role
        (default: `system:platform-admin`, `system:operator`,
        `system:model-compare`; `MCP_NON_DELEGABLE_ROLES` overrides), the
        exchange is refused with 403 and no credential is issued, and a
        `TokenExchangeDenied` audit row names both identities.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, subject_token, subject_token_type]
              properties:
                grant_type:
                  type: string
                  const: urn:ietf:params:oauth:grant-type:token-exchange
                subject_token:
                  type: string
                  description: The agent's token, or — when delegating — the PERSON's token.
                subject_token_type:
                  type: string
                  const: urn:ietf:params:oauth:token-type:jwt
                actor_token:
                  type: string
                  description: When delegating, the AGENT's token.
                actor_token_type:
                  type: string
                  const: urn:ietf:params:oauth:token-type:jwt
      responses:
        "200":
          description: A credential valid for five minutes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 300 }
        "401":
          description: |
            A token failed verification, or names an identity the platform does
            not know. The message says which, e.g.
            `actor_token verification failed: …`,
            `No user is provisioned for subject '…'. The person an agent acts for must be a known identity.`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: The person holds a non-delegable role.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, const: access_denied }
                  error_description: { type: string }
              example:
                error: access_denied
                error_description: "user 'ops-admin' holds a non-delegable role (system:platform-admin): an agent may not act for an administrator"

  /portal/catalog:
    get:
      tags: [Agents]
      summary: What the caller may call
      operationId: portalCatalog
      x-stability: preview
      description: |
        The servers and tools the caller's roles reach, as the developer portal
        shows them. When acting for a person, call it with the **person's**
        token alone — the intersection with your agent hides tools your agent
        happens to lack, which is a confusing answer to "what can I do here".
        Every call is gated regardless, so nothing becomes reachable by being
        listed.
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }

  /portal/token:
    post:
      tags: [Agents]
      summary: Mint a personal token from the developer portal
      operationId: portalToken
      x-stability: preview
      description: |
        Mints a token for the signed-in person, for a script or agent they run.
        It carries the person's own subject and roles — **never more**.

        * `scope: "my-access"` (or omitted): everything the person's roles allow.
        * `scope: "this-tool"` with `tool`: a token whose `scopes` claim is
          `["tool:<tool>"]` — the gateway refuses any other tool with it.

        ⚠ **Lifetime is one hour**, and the token cannot be revoked early: its
        short life is the control. Anything that must run longer belongs on a
        service account, which can be rotated and revoked.

        Administrators can disable minting (`portal.allow_mint_token`); the
        endpoint then returns 403.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  type: string
                  description: Free-text label recorded in the audit log. Does not affect access.
                scope:
                  type: string
                  enum: [my-access, this-tool]
                  default: my-access
                tool:
                  type: string
                  description: Required when `scope` is `this-tool`. Letters, digits, `_`, `-`, `.`; up to 128 characters.
                  example: get_system_time
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_in: { type: integer, example: 3600 }
                  purpose: { type: string }
                  scopes:
                    type: array
                    items: { type: string }
                    description: Empty for `my-access`; `["tool:<tool>"]` for `this-tool`.
        "400":
          description: '`scope` is `this-tool` but `tool` is missing or invalid.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: |
            Not signed in. ⚠ Deliberately 401, not 403, even when minting is
            disabled: telling an unauthenticated caller a feature is off tells
            them it exists.
        "403":
          description: Minting is disabled on this install, or the caller lacks portal access.

  # ─── Billing (preview) ──────────────────────────────────────────────────
  /billing/meter-events:
    get:
      tags: [Billing]
      summary: Metered calls, one row per call per dimension
      operationId: listMeterEvents
      x-stability: preview
      description: |
        The raw meter: one row per call **per dimension** (`calls`, `bytes`,
        tokens, `amount_usd`, …). Count calls on `dimension = calls`; the other
        rows are the same call's other measures.

        **Delegated calls** carry `on_behalf_of` (the person), `caller_type:
        user`, and a `caller_display` of `<person> · via <agent>`.
        `caller_user_id` remains the identity that authenticated (the agent).
        Filtering by `caller_user_id` matches either identity.

        **Retries** sent with the same `Idempotency-Key` produce one row.
      parameters:
        - { name: caller_user_id, in: query, schema: { type: string }, description: "Matches the authenticating identity OR the person a delegated call was for." }
        - { name: caller_type, in: query, schema: { type: string, enum: [user, service_account] } }
        - { name: dept_id, in: query, schema: { type: string, format: uuid } }
        - { name: server_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: namespace, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: A page of meter rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/MeterEvent" }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /contracts/{contractId}/costs:
    parameters:
      - name: contractId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Billing]
      summary: Rated cost of a contract for one billing period
      operationId: getContractCosts
      x-stability: preview
      description: |
        The rating engine's output for one period, by dimension.

        ⚠ `cost_state` here is the **rating** state (`ESTIMATED` until the
        period is finalised, then `FINAL`). The `cost_state` on meter events is
        a different thing — whether a rate card priced the row (`RATED` or
        blank). Calls appear here once rated, normally within a minute or two.
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, example: "2026-10" }
          description: '`YYYY-MM` or `YYYY-MM-DD`; either is read as that month. (Earlier builds accepted only `YYYY-MM-DD`.)'
      responses:
        "200":
          description: The period's costs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract_id: { type: string, format: uuid }
                  period: { type: string, example: "2026-10-01" }
                  total_usd: { type: number }
                  cost_state: { type: string, enum: [ESTIMATED, FINAL, ""] }
                  by_dimension:
                    type: array
                    items:
                      type: object
                      properties:
                        tool_id: { type: string }
                        dimension: { type: string }
                        quantity: { type: number }
                        amount_usd: { type: number }
                        cost_state: { type: string }
        "400":
          description: |
            `contract id must be a UUID`, or
            `period must be YYYY-MM or YYYY-MM-DD, e.g. 2026-10`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ─── System (preview) ───────────────────────────────────────────────────
  /admin/disk/health:
    get:
      tags: [System]
      summary: Host disk usage, as the platform sees it
      operationId: getDiskHealth
      x-stability: preview
      description: |
        Free space on the node's disk, read from inside the orchestrator pod.
        Kubernetes evicts pods — Postgres included — at roughly 85–90% used, so
        the thresholds sit below that. At `critical`, deploying, scaling up and
        pulling models are refused with `507`.
        Thresholds: `MCP_DISK_WARN_PCT` (75), `MCP_DISK_CRIT_PCT` (80).
      responses:
        "200":
          description: Disk usage.
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  path: { type: string, example: / }
                  total_bytes: { type: integer }
                  used_bytes: { type: integer }
                  avail_bytes: { type: integer }
                  used_pct: { type: number, example: 62.1 }
                  status: { type: string, enum: [ok, warning, critical] }
                  thresholds:
                    type: object
                    properties:
                      warning_pct: { type: number }
                      critical_pct: { type: number }
        "403": { description: Caller may not read platform health. }

  # ─── Namespaces ─────────────────────────────────────────────────────────
  /namespaces:
    get:
      tags: [Namespaces]
      summary: List namespaces the caller may act in
      operationId: listNamespaces
      description: |
        ⚠ Scoped to the caller. A namespace-confined principal sees only its
        own; a platform administrator sees all. The list is therefore an
        accurate statement of reach, not a global inventory.

        There is no create or delete counterpart. Namespaces are not managed
        as objects — see the Namespaces note in the API description.
      responses:
        "200":
          description: |
            Namespace names, plus whether the caller is unconfined.
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespaces:
                    type: array
                    items: { type: string }
                  wildcard:
                    type: boolean
                    description: |
                      True when the caller may act in ANY namespace, including
                      ones not yet created. A confined principal gets `false`
                      and only the namespaces it holds.
              example:
                namespaces: ["mcp-csis", "mcp-prod"]
                wildcard: true
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ─── Servers ────────────────────────────────────────────────────────────
  /servers:
    get:
      tags: [Servers]
      summary: List servers
      operationId: listServers
      description: |
        Returns every server the caller may see, across namespaces. Each entry
        is either an `internal` or an `external` server and **the two carry
        different fields** — see the `Server` schema.
      responses:
        "200":
          description: Servers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Server" }
        "401": { $ref: "#/components/responses/Unauthorized" }

    post:
      tags: [Servers]
      summary: Register a server
      operationId: createServer
      description: |
        Registers an internal (image-backed) or external (endpoint-backed)
        server. The `type` field discriminates, and the required fields differ
        accordingly.

        ⚠ **The namespace is created if it does not exist.** Naming it here is
        the only way a namespace comes into being — there is no namespace
        endpoint and no namespace editor in the UI.

        ⚠ **External servers are not routable until approved.** Registration
        puts them in `Registered`; `POST /servers/{ns}/{name}/approve` moves
        them to `Active` and builds the gateway route.

        ⚠ **Internal servers reach `Running` on their own**: the platform waits
        for the pod, runs the MCP handshake and discovers its tools — typically
        within seconds of the pod becoming ready.

        ⚠ **Disk guard.** An internal deploy is refused with `507` when the
        node's disk is at its critical threshold (see `GET /admin/disk/health`).
        `"ignore_disk_guard": true` overrides, and is logged.

        ⚠ **Leader-only.** See the 503 note in the API description.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CreateInternalServer"
                - $ref: "#/components/schemas/CreateExternalServer"
              discriminator:
                propertyName: type
                mapping:
                  internal: "#/components/schemas/CreateInternalServer"
                  external: "#/components/schemas/CreateExternalServer"
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
        "200":
          description: Registered (some builds return 200 rather than 201).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
        "400":
          description: |
            Validation failure. `mcp_port` must be 1–65535 and `replicas`
            1–1000; both are checked before parsing, because an out-of-range
            port would otherwise be silently truncated into a valid-looking one.
            A missing `namespace` also lands here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "402": { $ref: "#/components/responses/TierCapacity" }
        "403":
          description: |
            Refused by governance policy. The body carries a `violations` array
            naming each rule, its severity and the offending value — **read it
            rather than the top-level message**, which says only that a policy
            refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernanceRejection" }
        "409":
          description: |
            A server already exists with that name in that namespace, or (for
            external servers) at that endpoint URL in that namespace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/NotLeader" }
        "507": { $ref: "#/components/responses/InsufficientDisk" }

  /servers/{namespace}/{name}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/ServerName"
    get:
      tags: [Servers]
      summary: Get one server
      operationId: getServer
      responses:
        "200":
          description: The server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: |
            Transiently unavailable — the orchestrator could not reach its
            database. Retry.
    delete:
      tags: [Servers]
      summary: Delete a server
      operationId: deleteServer
      description: |
        Removes the server, its route, and — for DCR-provisioned external
        servers — the credential Secret registration created.

        ⚠ **Financial records survive.** `meter_events` and `cost_contracts`
        rows for this server are retained deliberately: chargeback integrity
        and SOC 2 evidence must outlive the resource they describe.

        ⚠ **Leader-only.**
      responses:
        "200": { description: Deleted. }
        "202": { description: Deletion accepted. }
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotLeader" }

  /servers/{namespace}/{name}/approve:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/ServerName"
    post:
      tags: [Servers]
      summary: Approve an external server
      operationId: approveServer
      description: |
        Moves an external server from `Registered` (or `Inactive`) to `Active`,
        builds its gateway cluster and route, resolves any mTLS client
        certificate from its Secret, and pushes the configuration.

        ⚠ **Approving an already-Active server is a RECONCILE, not a no-op.**
        A server can sit in `Active` with no route — re-approving rebuilds the
        downstream state and returns `reconciled: true`. This is the correct
        thing to try when traffic to an Active server 404s.

        ⚠ Valid only for `server_type: external`. Internal servers become
        routable through deployment, not approval.

        ⚠ **Leader-only.**
      responses:
        "200":
          description: Active.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, example: Active }
                  reconciled:
                    type: boolean
                    description: True when the server was already Active and downstream state was rebuilt.
        "400":
          description: |
            Not an external server, or not in a state approval accepts
            (`Registered` or `Inactive`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotLeader" }

  /servers/{namespace}/{name}/disable:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/ServerName"
    post:
      tags: [Servers]
      summary: Disable a server
      operationId: disableServer
      description: |
        Withdraws the server's gateway route. Traffic stops; the registration,
        its credentials and its history remain. Re-enable with `approve`.

        ⚠ **Leader-only.**
      responses:
        "200": { description: Disabled. }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotLeader" }

  /servers/{namespace}/{name}/tools:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/ServerName"
    get:
      tags: [Servers]
      summary: List a server's discovered tools
      operationId: listServerTools
      description: |
        Tools as discovered from the server itself, not as declared by an
        operator. `input_schema` is the tool's own JSON Schema, passed through.
      responses:
        "200":
          description: Tools.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tool" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── RBAC: roles ────────────────────────────────────────────────────────
  /roles:
    get:
      tags: [RBAC]
      summary: List roles
      operationId: listRoles
      responses:
        "200":
          description: Roles, both built-in and custom.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [RBAC]
      summary: Create a role
      operationId: createRole
      description: |
        ⚠ Do not create a role whose `id` begins `system:`. Those identifiers
        belong to built-in roles defined in the platform, and a database row
        shadowing one leaves two definitions of the same role that can diverge.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRole" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: A role with that id already exists. }
        "503": { $ref: "#/components/responses/NotLeader" }

  /roles/{roleId}:
    parameters:
      - name: roleId
        in: path
        required: true
        schema: { type: string }
        example: custom:portal-user
    delete:
      tags: [RBAC]
      summary: Delete a role
      operationId: deleteRole
      description: |
        ⚠ Users holding the role lose it. Tool permissions granted to it
        cascade away with it.
      responses:
        "200": { description: Deleted. }
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotLeader" }

  # ─── RBAC: users ────────────────────────────────────────────────────────
  /users:
    get:
      tags: [RBAC]
      summary: List users
      operationId: listUsers
      responses:
        "200":
          description: |
            Users, wrapped in an `items` envelope. Password hashes are never
            returned.

            ⚠ Note the inconsistency: `/users` and `/budgets` and `/namespaces`
            wrap their results; `/servers` and `/roles` return bare arrays.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [RBAC]
      summary: Create a user
      operationId: createUser
      description: |
        ⚠ **Set `email`.** It is the recovery path on an install with no
        identity provider, the destination for alerts, and what an IdP-returned
        identity is matched against if SSO is added later. A user created
        without one becomes a second, unmatchable account at that point.

        ⚠ A developer using the portal needs three roles together —
        `system:mcp-consumer`, `system:llm-consumer` and `system:api-consumer`.
        With only the first, their agent is refused the moment it reaches a
        model, which reads as a broken platform rather than a missing grant.

        ⚠ **Departments.** Delegated calls are charged to the *person's*
        department. A user in no department charges nobody — map people to a
        department for chargeback to attribute their spend.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUser" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: That username already exists. }
        "503": { $ref: "#/components/responses/NotLeader" }

  /users/{username}:
    parameters:
      - name: username
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [RBAC]
      summary: Delete a user
      operationId: deleteUser
      responses:
        "200": { description: Deleted. }
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotLeader" }

  /users/{username}/roles:
    parameters:
      - name: username
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [RBAC]
      summary: Replace a user's roles
      operationId: setUserRoles
      description: |
        ⚠ **Replaces, does not add.** The array you send becomes the user's
        complete role set; anything omitted is removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items: { type: string }
                  example: ["system:mcp-consumer", "system:llm-consumer", "system:api-consumer"]
      responses:
        "200": { description: Roles set. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotLeader" }

  # ─── RBAC: tool permissions ─────────────────────────────────────────────
  /tool-rbac/servers/{namespace}/{name}/permissions:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/ServerName"
    post:
      tags: [RBAC]
      summary: Grant or deny a role access to a server's tools
      operationId: createToolPermission
      description: |
        ⚠ **Each call ADDS a rule; it does not replace one.** Posting an ALLOW
        to a role that already carries a DENY leaves both in place, and DENY
        wins. To change a decision, delete the existing rule first.

        ⚠ **Enforcement is not immediate.** ext_authz decides from a cache that
        refreshes about once a minute, so a freshly written grant can take that
        long to take effect. Automation that writes a grant and immediately
        exercises it should poll rather than assume.

        ⚠ **`reason` is shown to callers.** When a rule refuses a call, its
        reason is appended to the gateway's denial after the fixed
        `No permission for tool …` text — write it for the person who will
        read it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateToolPermission" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolPermission" }
        "200":
          description: Created (some builds return 200).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolPermission" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/NotLeader" }

  /tool-rbac/servers/{namespace}/{name}/permissions/test:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/ServerName"
    post:
      tags: [RBAC]
      summary: Dry-run an authorization decision
      operationId: testToolPermission
      description: |
        Resolves what the policy engine WOULD decide for a set of roles,
        without making a call and without writing anything. Useful for proving
        a grant before relying on it, and for explaining a refusal: the trace
        lists every rule that matched, in precedence order.

        ⚠ **`role_ids` is an array.** (Earlier versions of this document showed
        a single `role_id`; the endpoint has always required the array.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_ids, tool_name]
              properties:
                role_ids:
                  type: array
                  items: { type: string }
                  example: ["system:mcp-consumer"]
                tool_name: { type: string, example: get_system_time }
      responses:
        "200":
          description: The decision, the rule that produced it, and every rule that matched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  server: { type: string }
                  tool_name: { type: string }
                  role_ids:
                    type: array
                    items: { type: string }
                  allowed: { type: boolean }
                  effect_applied:
                    type: string
                    enum: [ALLOW, DENY, NO_POLICY, ENFORCEMENT_DISABLED]
                  reason:
                    type: string
                    description: For a refusal, the same text the gateway returns — `No permission for tool …`.
                  matched_policy_id: { type: string, format: uuid }
                  matched_role_id: { type: string }
                  matched_pattern: { type: string }
                  matched_pattern_type: { type: string, enum: [EXACT, WILDCARD, REGEX] }
                  matching_policies_trace:
                    type: array
                    description: Every matching rule, in precedence order; the first decided.
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        role_id: { type: string }
                        tool_pattern: { type: string }
                        pattern_type: { type: string }
                        effect: { type: string }
        "400":
          description: '`role_ids (array) and tool_name are required`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tool-rbac/permissions/{permissionId}:
    parameters:
      - name: permissionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [RBAC]
      summary: Delete a tool permission rule
      operationId: deleteToolPermission
      responses:
        "200": { description: Deleted. }
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotLeader" }

  # ─── Budgets ────────────────────────────────────────────────────────────
  /budgets:
    get:
      tags: [Budgets]
      summary: List budgets
      operationId: listBudgets
      responses:
        "200":
          description: Budgets, wrapped in a `budgets` envelope.
          content:
            application/json:
              schema:
                type: object
                properties:
                  budgets:
                    type: array
                    items: { $ref: "#/components/schemas/Budget" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /budgets/{namespace}/{name}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/ServerName"
    get:
      tags: [Budgets]
      summary: Get a server's budget
      operationId: getBudget
      responses:
        "200":
          description: The budget, with current usage against it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "404":
          description: |
            No budget set for this server. ⚠ The current message reads
            `Server not found: <ns>/<name>` even when the server exists —
            treat any 404 here as "no budget".
    put:
      tags: [Budgets]
      summary: Set or replace a server's budget
      operationId: putBudget
      description: |
        A budget caps spend either as a percentage of the server's contractual
        commitment or as an absolute dollar limit. When both are present the
        stricter applies.

        ⚠ **Enforcement lags the write by roughly 45 seconds** — the gateway
        decides from a cached view. A client that sets a budget and immediately
        expects a block should poll rather than assume.

        ⚠ A percentage-anchored budget cannot be set below current usage: there
        is no threshold that would refuse traffic already incurred. Use the
        absolute limit for that case.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutBudget" }
      responses:
        "200":
          description: Set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotLeader" }

  /budgets/{namespace}/{name}/override:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/ServerName"
    post:
      tags: [Budgets]
      summary: Override a budget block
      operationId: setBudgetOverride
      description: |
        Lifts enforcement without deleting the budget — the ceiling stays
        recorded and visible, traffic resumes. The audit trail records who
        overrode it and when.

        ⚠ Subject to the same ~45s cache lag as setting a budget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [override]
              properties:
                override: { type: boolean }
      responses:
        "200": { description: Override set. }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotLeader" }

  /budgets/{budgetId}:
    parameters:
      - name: budgetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Budgets]
      summary: Delete a budget
      operationId: deleteBudget
      responses:
        "200": { description: Deleted. }
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotLeader" }

# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A service-account JWT for automation, an exchanged token for an agent,
        or a token from `/auth/login` for interactive use. The token's `sub` is
        the identity every grant is keyed on; its optional `scopes` claim
        narrows what it may call at the gateway.

  parameters:
    Namespace:
      name: namespace
      in: path
      required: true
      schema: { type: string }
      example: mcp-prod
      description: |
        The tenant the request is for. The caller must be permitted to act in
        it; a namespace-confined principal addressing another namespace is
        refused, not given an empty result.
    ServerName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9-]{2,62}$"
      example: alpha-vantage

  responses:
    Unauthorized:
      description: Missing, malformed or expired token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource in that namespace.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Validation failure; the body names the field and the value.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotLeader:
      description: |
        ⚠ **Not an error — retry it.** Mutating operations are leader-only and
        this replica is not the leader. `Retry-After: 1` is set; the load
        balancer routes the retry to a different pod.

        A client that treats this as a failure will appear to break
        intermittently on any multi-replica install. Every first-party client
        retries it (`mcpctl` and the regression suite both do), and yours
        should too — a handful of attempts with a short pause is sufficient.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying. Honour it rather than inventing a backoff.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: this orchestrator pod is not the current leader; retry the request
              hint:
                type: string
                example: the load balancer will route the retry to a different pod
              operation:
                type: string
                example: deploy_server
    TierCapacity:
      description: |
        The licence tier's server limit has been reached. The body carries the
        current count and the cap so a client can report the ceiling rather
        than the refusal.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              current: { type: integer }
              cap: { type: integer }
    InsufficientDisk:
      description: |
        The node's disk is at its critical threshold, so an operation that adds
        to it (deploy, scale up, model pull) was refused before it could take
        the control plane down. Free space or grow the disk, then retry.
        `"ignore_disk_guard": true` in the request body overrides (logged).
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, const: insufficient_disk }
              detail: { type: string }
              used_pct: { type: number }
              critical_pct: { type: number }
              avail_gb: { type: number }

  schemas:

    # ── VERIFIED against a live response, 2026-08-16 ────────────────────
    Server:
      description: |
        ⚠ **Two shapes, one endpoint.** An `internal` server is image-backed
        and carries deployment fields; an `external` server is endpoint-backed
        and carries auth fields. `server_type` discriminates, and a client that
        assumes one shape will find fields missing on the other.
      oneOf:
        - $ref: "#/components/schemas/InternalServer"
        - $ref: "#/components/schemas/ExternalServer"
      discriminator:
        propertyName: server_type
        mapping:
          internal: "#/components/schemas/InternalServer"
          external: "#/components/schemas/ExternalServer"

    ServerCommon:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        namespace: { type: string }
        server_type: { type: string, enum: [internal, external, hybrid] }
        state:
          type: string
          description: |
            `Running` is the serving state for internal servers; `Active` is
            the serving state for external ones. `Registered` means an external
            server awaits approval.
          enum: [Pending, Registered, Deploying, Probing, Running, Active, Inactive, Failed, ProbeFailed]
        deployed_by: { type: string }
        routing_mode: { type: string, example: v3 }
        group_name: { type: string }
        clone_of:
          type: string
          description: ⚠ Empty string when not a clone, not null.
          example: ""
        labels:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
        env_vars:
          type: object
          additionalProperties: { type: string }
        command:
          type: array
          items: { type: string }
        args:
          type: array
          items: { type: string }
        tools:
          type: array
          items: { $ref: "#/components/schemas/Tool" }
        health: { $ref: "#/components/schemas/Health" }

    InternalServer:
      allOf:
        - $ref: "#/components/schemas/ServerCommon"
        - type: object
          properties:
            image: { type: string, example: curtismager20/mcp-docs }
            image_tag: { type: string, example: v1 }
            transport: { type: string, enum: [streamable_http, sse, stdio] }
            upstream_path: { type: string, example: /mcp }
            mcp_port: { type: integer }
            cluster_port: { type: integer }
            cluster_ip:
              type: string
              description: ⚠ The literal string `"None"` when unset, not null.
              example: "None"
            replicas: { type: integer }
            min_replicas: { type: integer }
            max_replicas: { type: integer }
            cpu_request: { type: number }
            cpu_limit: { type: number }
            memory_request_mb: { type: integer }
            memory_limit_mb: { type: integer }

    ExternalServer:
      allOf:
        - $ref: "#/components/schemas/ServerCommon"
        - type: object
          properties:
            endpoint_url: { type: string, format: uri }
            auth_type:
              type: string
              enum: [none, bearer, api-key, oauth2-client-credentials, oauth2-authorization-code, mtls]
            credential_secret_ref:
              type: string
              description: |
                Kubernetes Secret holding the credential. For DCR servers the
                platform creates `{name}-dcr-creds` itself.
            credential_mode:
              type: string
              enum: [centralized, delegated]
              description: |
                `centralized` uses one operator-held credential for all callers.
                `delegated` obtains a per-user token via OAuth, so the vendor
                sees the end user rather than the platform.
            tls_min_version: { type: string, example: tls1_2 }
            upstream_http_version: { type: string, example: http1 }

    Health:
      type: object
      description: |
        Live figures for internal servers, filled by the platform's health
        monitor. ⚠ On builds before 2026-10-05, one server whose Deployment had
        disappeared stopped the monitor for every server after it, leaving all
        zeros; those builds also left new internal servers in `Deploying`.
      properties:
        liveness: { type: boolean }
        readiness: { type: boolean }
        ready_replicas: { type: integer }
        total_replicas: { type: integer }
        cpu_usage_pct: { type: number }
        memory_usage_pct: { type: number }
        requests_per_second: { type: integer }
        error_count_1m: { type: integer }

    Tool:
      type: object
      description: A tool as discovered from the server, not as declared.
      properties:
        name: { type: string }
        description: { type: string }
        category: { type: string }
        read_only:
          type: boolean
          description: |
            ⚠ Reported by the server. Governance can warn on mutating tools,
            but the value is only as accurate as the server's own declaration.
        idempotent: { type: boolean }
        injection_flagged:
          type: boolean
          description: Set when the description was flagged as a possible prompt-injection vector.
        injection_reason: { type: string }
        input_schema:
          type: object
          description: The tool's own JSON Schema, passed through unmodified.
          additionalProperties: true

    # ── INFERRED — check against a live response before publishing ──────
    Role:
      type: object
      properties:
        id: { type: string, example: system:mcp-consumer }
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        allowed_namespaces:
          type: array
          items: { type: string }
          description: |
            The tenants this role may act in. `["*"]` is unconfined.

            ⚠ Separate from, and evaluated independently of, the namespace on
            each permission. Confinement answers "is this tenant visible at
            all"; the permission answers "may this verb be used here". Both
            must pass.
        is_admin_tier:
          type: boolean
          description: |
            Whether the role counts toward the admin-tier ceiling. Compliance
            controls bound how many such roles may exist.
        system_role:
          type: boolean
          description: |
            ⚠ Built-in, defined in the platform itself. Do not create a custom
            role whose `id` shadows one — the resolver and this API would then
            describe different access.

    Permission:
      type: object
      description: |
        One grant: a set of verbs, on a resource type, in a namespace.

        ⚠ **Both `resource_type` and `actions` are numeric.** They are the
        platform's internal enum values, exposed as-is. Decode them with the
        tables below; do not guess from ordering.
      properties:
        resource_type:
          type: integer
          description: |
            | Value | Resource |
            |---|---|
            | 0 | MCPServer |
            | 1 | MCPGroup |
            | 2 | GatewayRoute |
            | 3 | AuditLog |
            | 4 | Role |
            | 5 | Policy |
          enum: [0, 1, 2, 3, 4, 5]
          example: 0
        resource_name:
          type: string
          description: '`"*"` matches every resource of that type.'
          example: "*"
        namespace:
          type: string
          description: '`"*"` matches every namespace.'
          example: mcp-csis
        actions:
          type: integer
          format: uint32
          description: |
            ⚠ **A BITMASK, not a single value.** Combine with bitwise OR; test
            with bitwise AND. `actions: 5` is `Read | Deploy`, not "action 5".

            | Bit | Value | Action |
            |---|---|---|
            | 0 | 1 | Read |
            | 1 | 2 | Write |
            | 2 | 4 | Deploy |
            | 3 | 8 | Undeploy |
            | 4 | 16 | Scale |
            | 5 | 32 | ViewLogs |
            | 6 | 64 | ManageRoles |
            | 7 | 128 | ManageGateway |
            | 8 | 256 | AuditRead |
            | 9 | 512 | BillingRead |
            | 10 | 1024 | BillingWrite |

            `0` is None; `4294967295` (0xFFFFFFFF) is All.
          example: 1

    CreateRole:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: custom:portal-user
          description: ⚠ Do not use a `system:` prefix — those are reserved for built-ins.
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        allowed_namespaces:
          type: array
          items: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email:
          type: string
          format: email
          description: |
            Contact address. ⚠ Distinct from `sso_email`: this is stable and
            operator-set, that one is whatever the IdP returned.
        sso_email:
          type: string
          format: email
          description: Binds the account to an IdP-provided identity.
        roles:
          type: array
          items: { type: string }
        enabled: { type: boolean }
        provisioned_via:
          type: string
          enum: [password, sso_jit, scim]
          description: |
            How the account came into being. SCIM-managed fields are read-only
            in the admin UI.
        created_at:
          type: string
          description: |
            ⚠ **A unix epoch, as a STRING** — e.g. `"1780679568"`. Not ISO-8601,
            and not a number. `last_used_at` on the same object IS ISO-8601;
            the two are inconsistent and this document records that rather than
            hiding it.
          example: "1780679568"
        last_used_at:
          type: string
          format: date-time
          description: ISO-8601, unlike `created_at`.
          example: "2026-08-14T12:27:33Z"

    CreateUser:
      type: object
      required: [username, password, roles]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        email:
          type: string
          format: email
          description: ⚠ Set it. See the operation description.
        roles:
          type: array
          items: { type: string }

    CreateInternalServer:
      type: object
      required: [type, name, namespace, image]
      properties:
        type: { type: string, const: internal }
        name:
          type: string
          pattern: "^[a-z][a-z0-9-]{2,62}$"
        namespace:
          type: string
          description: |
            ⚠ Required — not defaulted. The Kubernetes namespace is created if
            it does not already exist.
        image: { type: string }
        image_tag: { type: string, default: latest }
        mcp_port: { type: integer, minimum: 1, maximum: 65535 }
        upstream_path: { type: string, default: "/mcp" }
        transport:
          type: string
          enum: [streamable_http, sse, stdio]
          default: streamable_http
          description: |
            ⚠ `stdio` is refused by the default internal policy — it is not
            permitted for a governed server.
        replicas: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        cpu_limit: { type: number }
        memory_limit_mb: { type: integer }
        labels:
          type: object
          additionalProperties: { type: string }
          description: |
            ⚠ If the `enterprise-standard` governance policy is enabled, a
            `team` label is required and registration without one is refused.
        command:
          type: array
          items: { type: string }
        args:
          type: array
          items: { type: string }
        env_vars:
          type: object
          additionalProperties: { type: string }
        ignore_disk_guard:
          type: boolean
          default: false
          description: |
            Deploy even when the node's disk is critical. For emergencies;
            logged. See `GET /admin/disk/health`.

    CreateExternalServer:
      type: object
      required: [type, name, namespace, endpoint_url, auth_type]
      properties:
        type: { type: string, const: external }
        name:
          type: string
          pattern: "^[a-z][a-z0-9-]{2,62}$"
        namespace:
          type: string
          description: |
            ⚠ Required — not defaulted. The Kubernetes namespace is created if
            it does not already exist.
        endpoint_url: { type: string, format: uri }
        auth_type:
          type: string
          enum: [none, bearer, api-key, oauth2-client-credentials, oauth2-authorization-code, mtls]
        credential_secret_ref:
          type: string
          description: |
            Required for every auth type except `none` and
            `oauth2-authorization-code`. For the latter the platform performs
            dynamic client registration and creates `{name}-dcr-creds` itself —
            if the vendor advertises no protected-resource metadata, discovery
            fails and registration returns 400.
        credential_mode:
          type: string
          enum: [centralized, delegated]
          default: centralized
        labels:
          type: object
          additionalProperties: { type: string }

    Budget:
      type: object
      description: |
        A spend cap and its current consumption. The read side carries live
        figures, so a client can report headroom rather than only the ceiling.
      properties:
        id: { type: string, format: uuid }
        scope_type: { type: string, example: server }
        server_id: { type: string, format: uuid }
        threshold_pct:
          type: [number, "null"]
          description: |
            Percentage of the contractual commitment at which traffic is
            refused. Null when the budget is absolute-only.
        limit_usd:
          type: [number, "null"]
          description: |
            Absolute ceiling in USD. Applied alongside `threshold_pct`; when
            both are set the stricter wins. Null when percentage-only.
        budget_amount_usd:
          type: [number, "null"]
          description: The resolved ceiling in dollars, whichever rule produced it.
        commitment_usd:
          type: number
          description: |
            The server's contractual commitment, which `threshold_pct` is a
            percentage OF. ⚠ Zero when no contract carries one — in which case
            a percentage-anchored budget has nothing to anchor to and the
            absolute limit is the only usable rule.
        usage_usd:
          type: number
          description: Spend in the current billing period.
        pct_consumed:
          type: [number, "null"]
          description: Usage as a percentage of the commitment. Null when there is no commitment.
        over_budget:
          type: boolean
          description: |
            Whether the cap is currently exceeded. ⚠ Reflects the rating
            engine's view, which the gateway's enforcement cache trails by
            roughly 45 seconds.
        override:
          type: boolean
          description: When true the budget is recorded and visible but not enforced.
        created_by: { type: string }

    PutBudget:
      type: object
      properties:
        threshold_pct: { type: number, minimum: 0, maximum: 100 }
        limit_usd: { type: number, minimum: 0 }
        override: { type: boolean, default: false }

    CreateToolPermission:
      type: object
      required: [role_id, pattern_type, tool_pattern, effect]
      properties:
        role_id: { type: string }
        pattern_type:
          type: string
          enum: [EXACT, WILDCARD, REGEX]
        tool_pattern:
          type: string
          example: "*"
        effect:
          type: string
          enum: [ALLOW, DENY]
          description: ⚠ DENY wins over ALLOW when both match.
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        reason:
          type: string
          description: Appended to the gateway's denial when this rule refuses a call — callers read it.

    ToolPermission:
      allOf:
        - $ref: "#/components/schemas/CreateToolPermission"
        - type: object
          properties:
            id: { type: string, format: uuid }
            server_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            created_by: { type: string }

    MeterEvent:
      type: object
      description: |
        Preview. One measure of one call. A call writes one row per dimension;
        `billing_group_id` ties a call's rows together.
      properties:
        incurred_at: { type: string, format: date-time }
        caller_user_id:
          type: string
          description: The identity that authenticated — the agent, on a delegated call.
        caller_type: { type: string, enum: [user, service_account] }
        caller_display:
          type: string
          description: '`<person> · via <agent>` on a delegated call.'
          example: "zuraiz-user@example.com · via zuraiz-path-a"
        on_behalf_of:
          type: string
          description: The person a delegated call was made for. Empty on a direct call.
        dept_id: { type: string }
        dept_name: { type: string }
        cost_center: { type: string }
        server_id: { type: string, format: uuid }
        server_name: { type: string }
        namespace: { type: string }
        tool_id: { type: string }
        method: { type: string }
        dimension: { type: string, example: calls }
        quantity: { type: number }
        amount_usd: { type: number }
        cost_state:
          type: string
          description: '`RATED` when a rate card priced this dimension; blank when nothing did.'
        status: { type: string, enum: [success, error] }
        session_id: { type: string }
        idempotency_key: { type: string }
        billing_group_id: { type: string, format: uuid }

    LoginToken:
      type: object
      properties:
        token: { type: string }
        username: { type: string }
        roles:
          type: array
          items: { type: string }
        mfa_bootstrap:
          type: boolean
          description: |
            True when an administrator logged in by password because no
            identity provider is connected yet (bootstrap mode). MFA is
            enforced once one is. Absent otherwise.

    LoginMfaChallenge:
      type: object
      description: |
        The account is on the two-phase MFA chain. Complete the IdP leg with
        the `pending` ticket. ⚠ Automation cannot proceed past this — use a
        service-account token instead.
      properties:
        mfa_required: { type: boolean, const: true }
        pending: { type: string }
        username: { type: string }
        providers:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }

    GovernanceRejection:
      type: object
      description: |
        ⚠ Read `violations`, not `error`. The top-level message says only that
        a policy refused; the array says which rule, on which field, with what
        value, and at what severity. Only `severity: error` entries block —
        warnings are advisory and the deployment proceeds.
      properties:
        allowed: { type: boolean, const: false }
        error: { type: string }
        error_count: { type: integer }
        warning_count: { type: integer }
        violations:
          type: array
          items:
            type: object
            properties:
              policy_name: { type: string }
              category: { type: string }
              field: { type: string }
              expected: { type: string }
              actual_value: { type: string }
              message: { type: string }
              severity: { type: string, enum: [error, warning] }

    Error:
      type: object
      properties:
        error: { type: string }
        detail: { type: string }
        hint: { type: string }
